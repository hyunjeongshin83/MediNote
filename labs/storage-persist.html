<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>메디노트 실험 — 기기 저장 공간을 「지우지 말아 주세요」로 요청 (StorageManager)</title>
<!-- 실험 화면입니다. 앱 본체에서 링크하지 않습니다 (labs/ 아래 별도 화면 규칙).
     무엇을 실험하나: 복용 기록 · 복약 일정 · 증상 기록 사본은 이 기기의 localStorage 에 있습니다. 브라우저가 저장 공간이 모자라거나
     오래 안 쓰면 이 기록을 지울 수 있는데, navigator.storage.persist() 로 「지우지 말아 달라」고 요청할 수 있습니다.
     이 화면은 요청하기 전·후의 상태(persisted · 사용량 · 한도)만 읽어 화면에 보여 줍니다.
     브라우저 내장, 무료, 어떤 데이터도 밖으로 나가지 않고 이 화면은 어떤 값도 저장하지 않습니다(저장 상태만 읽음).
     새 색 · 새 글자 크기는 쓰지 않고 메디노트 토큰만 씁니다. 지원하지 않으면 안내만 보입니다. -->
<style>
  :root{ --brand:#0A7168; --brand-deep:#06413E; --n-200:#D8E5E7; --n-700:#274549;
         --fs-body:1.0625rem; --fs-sub:.9375rem; --fs-title2:1.375rem; --sp-2:8px; --sp-4:16px; --sp-6:24px; --r-md:12px; }
  html{ font-size:100%; }
  body{ margin:0; background:#fff; color:var(--n-700); font:var(--fs-body)/1.55 Pretendard,-apple-system,"Noto Sans KR",sans-serif; word-break:keep-all; }
  main{ max-width:480px; margin:0 auto; padding:var(--sp-6) var(--sp-4); }
  h1{ font-size:var(--fs-title2); margin:0 0 var(--sp-2); }
  p{ margin:0 0 var(--sp-4); }
  .sub{ font-size:var(--fs-sub); }
  .btn{ display:block; width:100%; min-height:48px; border:0; border-radius:var(--r-md); background:var(--brand); color:#fff; font:inherit; font-weight:700; cursor:pointer; margin-bottom:var(--sp-4); }
  .btn:focus-visible{ outline:3px solid var(--brand); outline-offset:2px; }
  dl{ margin:0 0 var(--sp-4); border:2px solid var(--n-200); border-radius:var(--r-md); padding:var(--sp-4); }
  dt{ font-size:var(--fs-sub); margin-top:var(--sp-2); }
  dt:first-child{ margin-top:0; }
  dd{ margin:0; font-weight:700; }
  #msg{ font-size:var(--fs-sub); min-height:1.5em; }
</style>
</head>
<body>
<main>
  <h1>기기 저장 공간 지키기 실험</h1>
  <p class="sub">복용 기록·복약 일정·증상 기록 사본은 이 기기에 저장돼요. 아래 단추는 브라우저에 「지우지 말아 주세요」라고 요청하고, 그 전후의 상태만 보여 줘요. 이 화면은 아무것도 저장하거나 보내지 않아요.</p>
  <dl aria-live="polite">
    <dt>지금 상태</dt><dd id="st">확인 중…</dd>
    <dt>쓴 공간 / 쓸 수 있는 공간</dt><dd id="us">확인 중…</dd>
  </dl>
  <button class="btn" id="ask" type="button">지우지 말아 달라고 요청하기</button>
  <p id="msg" role="status"></p>
</main>
<script>
(function(){
  var st=document.getElementById("st"), us=document.getElementById("us"), ask=document.getElementById("ask"), msg=document.getElementById("msg");
  var S=navigator.storage;
  function mb(n){ return (n/1048576).toFixed(1)+" MB"; }
  if(!S || typeof S.persist!=="function"){
    st.textContent="이 브라우저는 지원하지 않아요"; us.textContent="—"; ask.disabled=true; return;
  }
  function read(){
    S.persisted().then(function(p){ st.textContent = p ? "지워지지 않게 보호됨" : "보호 요청 전 (브라우저가 지울 수 있음)"; });
    if(S.estimate) S.estimate().then(function(e){ us.textContent = mb(e.usage||0)+" / "+mb(e.quota||0); });
  }
  read();
  ask.addEventListener("click", function(){
    S.persist().then(function(ok){
      msg.textContent = ok ? "요청이 받아들여졌어요." : "브라우저가 이번에는 받아들이지 않았어요. 설치형 앱이나 자주 쓰면 허락되기도 해요.";
      read();
    });
  });
})();
</script>
</body>
</html>
