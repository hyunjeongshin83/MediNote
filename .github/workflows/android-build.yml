# APK 자동 빌드 — APK_빌드안내.md 가 있다고 적었는데 없던 그 파일입니다
#
# 왜 이제야 만드나
#   빌드가 막힌 것이 셋 있었고(래퍼 · 아이콘 · 건강 연동 의존성), 그것부터
#   고쳐야 의미가 있었습니다. 먼저 만들었으면 빨간 실패만 쌓였을 것입니다.
#
# 이 작업 환경에서는 확인할 수 없던 것
#   dl.google.com(Google Maven)과 services.gradle.org 가 막혀 있어
#   의존성 판본이 실제로 받아지는지 확인하지 못했습니다.
#   **Actions 러너는 그 주소에 닿습니다.** 그래서 이 워크플로의 첫 실행이
#   곧 그 확인입니다. 빨갛게 뜨면 로그에 무엇이 안 받아졌는지 나옵니다.
#
# Gradle 래퍼(gradlew · gradle-wrapper.jar)는 일부러 안 넣었습니다.
#   래퍼 jar 는 저장소에 넣는 바이너리라 무엇이 들었는지 눈으로 볼 수 없습니다.
#   여기서는 setup-gradle 이 판본을 박아 설치하므로 래퍼가 필요 없습니다.
#   판본은 gradle/wrapper/gradle-wrapper.properties 와 같은 8.9 로 맞춰 둡니다.
#
# 나오는 것은 **디버그 빌드**입니다. 지인에게 파일로 건네는 용도입니다.
# 플레이스토어 등록에는 본인 개발자 키로 서명한 릴리스 빌드가 따로 필요합니다.

name: 안드로이드 APK

on:
  push:
    paths:
      - 'MediNote_apps_0706/android/**'
      - 'MediNote_app.html'
      - 'tools/build-packaged-app.py'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'MediNote_apps_0706/android/**'
      - 'MediNote_app.html'
      - 'tools/build-packaged-app.py'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ── 앱 화면이 웹앱과 갈라지지 않았는지 ──────────────────────
      # 7월 사본이 두 달 넘게 웹앱과 달랐던 적이 있습니다 (issues #12).
      # 손으로 옮기면 또 벌어지므로 빌드 첫 단계에서 봅니다.
      - name: 앱 화면이 웹앱과 같은지
        run: |
          python3 tools/build-packaged-app.py --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'          # app/build.gradle 의 jvmTarget 과 같게

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'       # gradle-wrapper.properties 와 같게

      - name: 빌드
        working-directory: MediNote_apps_0706/android
        run: gradle assembleDebug --stacktrace

      - name: APK 받아 두기
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: medinote-debug-${{ github.run_number }}
          path: MediNote_apps_0706/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 실패했을 때 무엇이 막혔는지 보려고 남깁니다
      - name: 실패 기록 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            MediNote_apps_0706/android/app/build/reports/
            MediNote_apps_0706/android/build/reports/
          retention-days: 14
          if-no-files-found: ignore
