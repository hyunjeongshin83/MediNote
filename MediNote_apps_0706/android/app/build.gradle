plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'kr.medit.medinote'
    compileSdk 35

    defaultConfig {
        applicationId "kr.medit.medinote"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.5"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    /* 2026-09-25: Compose 셸 → WebViewAssetLoader 셸 (금연노트 android/ 와 같은 구성).
       file:// 로 띄우면 서비스워커·푸시·Web Bluetooth 가 안 돌아 웹앱과 갈라졌습니다 (#20). */
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.webkit:webkit:1.12.1'
    /* HealthConnectManager.kt — 판본은 2026-09-20 Actions 에서 받아진 것 그대로 (HEALTH_SETUP.md) */
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha07'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
