<!DOCTYPE html>
<!-- 이 파일은 tools/build-packaged-app.py 가 MediNote_app.html 에서 만들었습니다.
     여기를 직접 고치지 마세요 — 다음 실행 때 지워집니다.
     화면을 고칠 곳은 저장소 맨 위의 MediNote_app.html 한 곳뿐입니다. -->
<html lang="ko"><head><meta charset="UTF-8">
<!-- maximum-scale·user-scalable 을 빼서 손가락으로 키워 볼 수 있게 했습니다.
     고령 사용자에게는 이것이 글자를 키우는 유일한 방법입니다 (WCAG 2.2 SC 1.4.4). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12BDB0">
<title>MediNote</title>
<!-- ===== MediNote 실제연결 레이어 (UI 변경 없음 · 기능만 추가) ===== -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MediNote">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<script>
(function(){
  // (1) PWA — 설치형/오프라인 (Play스토어 TWA용). UI에 영향 없음.
  /* 서비스워커는 패키징본에서 뺐습니다 — file:// 에서는 등록이 거부됩니다 (#16) */
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); window.__mnInstall=e; });

  // (2) AI 도우미 — 브라우저에서 Anthropic 을 직접 부르지 않는다.
  //     예전에는 사용자 각자에게 sk-ant-… 키를 물어봤는데, 어르신 사용자가 그 키를
  //     가지고 있을 리 없어 도우미가 사실상 아무에게도 작동하지 않았다. 키는 이제
  //     엣지함수(ai-helper)에만 있고, 앱은 로그인 세션으로 그 함수를 부른다.
  //     앱 곳곳의 기존 Anthropic 호출을 그대로 두고 여기서 함수 호출로 갈아끼운다.
  var _fetch = window.fetch ? window.fetch.bind(window) : null;

  function reply(text, extra){
    // 기존 코드가 Anthropic 응답 모양을 기대하므로 같은 모양으로 돌려준다.
    var body = Object.assign({ content: [{ type: "text", text: String(text || "") }] }, extra || {});
    return new Response(JSON.stringify(body), {
      status: 200, headers: { "Content-Type": "application/json; charset=utf-8" }
    });
  }

  async function viaHelper(opts){
    var cfg = window.MEDINOTE_CONFIG, kv = window.MediNoteKV;
    var token = kv && kv.token && kv.token();
    if(!token){
      return reply("도우미는 로그인 후 이용하실 수 있어요. 화면 오른쪽 위 \u201C로그인\u201D 을 눌러 주세요. "
        + "로그인하시면 남기신 기록에 맞춰 안내해 드립니다.");
    }
    var sent = {};
    try{ sent = (typeof opts.body === "string") ? JSON.parse(opts.body) : (opts.body || {}); }catch(e){}

    // [[NOCARD]] 는 앱 내부 자동채움용 — 웹검색 없이 원래 지시문을 그대로 쓴다.
    var sys = (typeof sent.system === "string") ? sent.system : "";
    var internal = sys.indexOf("[[NOCARD]]") > -1;

    var payload = {
      messages: (sent.messages || []).map(function(m){
        var c = m && m.content;
        if(Array.isArray(c)) c = c.map(function(b){ return (b && b.text) || ""; }).join("\n");
        return { role: m && m.role, content: String(c == null ? "" : c) };
      }),
      max_tokens: sent.max_tokens,
      web_search: !internal
    };
    if(internal || sys) payload.system = sys;
    if(!internal && window.MediNoteHelperContext){
      try{ payload.context = window.MediNoteHelperContext(); }catch(e){}
    }

    try{
      var r = await _fetch(cfg.functionsUrl + "/ai-helper", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, apikey: cfg.key, "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      var d = null; try{ d = await r.json(); }catch(e){}
      if(d && d.ok) return reply(d.text, { model: d.model, sources: d.sources || [] });
      return reply((d && d.message) || ("도우미에 연결하지 못했습니다 (" + r.status + ")."));
    }catch(e){
      return reply("도우미에 연결하지 못했습니다. 네트워크를 확인해 주세요.");
    }
  }

  if(_fetch){
    window.fetch = function(url, opts){
      try{
        var u = (typeof url==="string") ? url : (url && url.url) || "";
        if(u.indexOf("api.anthropic.com")>-1) return viaHelper(opts || {});
      }catch(e){}
      return _fetch(url, opts);
    };
  }

  // 개인 키를 받던 통로는 없앤다. 예전 키가 남아 있으면 지운다.
  try{ localStorage.removeItem("medit:apikey"); }catch(e){}
  window.MediNoteSetKey = function(){
    console.warn("[MediNote] 개인 API 키는 더 쓰지 않습니다. 도우미는 서버(ai-helper)를 통해 동작합니다.");
  };
})();
</script>

<script>/* medinote.config.js */
/* ============================================================
   MediNote 접속 설정 — 프로필 DB 주소는 여기 한 곳에만 둡니다.

   다른 Supabase 프로젝트로 옮길 때는 아래 REF 와 KEY 두 줄만 고치면
   앱·증상신고·오늘기록·안내카드 페이지가 한꺼번에 따라옵니다.

   KEY 는 publishable(공개) 키입니다. 브라우저에 노출되는 것이 정상이며,
   실제 접근 통제는 행 수준 보안(RLS)과 RPC 함수가 합니다.
   시크릿 키는 절대 여기 두지 마세요.
   ============================================================ */
(function () {
  var REF = "xaclqvveppvccdpebzsz";
  var KEY = "sb_publishable_i0msp00o_4-JOBp9JjZLww_VExbio2b";

  window.MEDINOTE_CONFIG = {
    ref: REF,
    url: "https://" + REF + ".supabase.co",
    functionsUrl: "https://" + REF + ".functions.supabase.co",
    key: KEY
  };
})();

</script>

<!-- ===== MediNote Supabase 공용 계층 (RPC 게이트웨이 · 세션 공유) ===== -->
<script>
(function(){
  "use strict";
  var SB_URL=window.MEDINOTE_CONFIG.url;
  var SB_KEY=window.MEDINOTE_CONFIG.key;
  var session=null;

  // hub_state 직접 호출은 익명 목록 열거를 막느라 닫혔다. 게스트가 쓰는 읽기·쓰기는
  // 전부 SECURITY DEFINER RPC 로 나가고, 키를 정확히 아는 1건씩만 응답한다.
  function rpc(fn,body){
    var tok=(session&&session.access_token)||SB_KEY;
    return fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",
      headers:{apikey:SB_KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json"},
      body:JSON.stringify(body||{})})
      .then(function(r){ if(!r.ok) throw new Error("RPC "+fn+" HTTP "+r.status); return r.json(); });
  }

  /* 리포트 키는 그 자체가 열쇠다 — 이메일이나 "guest" 는 남이 맞힐 수 있어서 열쇠가 못 된다.
     로그인하면 자기 uid(UUID, JWT로 증명), 아니면 기기마다 다른 난수 토큰을 쓴다. */
  function devToken(){
    var k="medinote:devtoken", v=null;
    try{ v=localStorage.getItem(k); }catch(e){}
    if(/^g_[0-9a-f]{32}$/.test(v||"")) return v;
    var b=new Uint8Array(16), c=window.crypto||window.msCrypto;
    if(c&&c.getRandomValues) c.getRandomValues(b);
    else for(var i=0;i<16;i++) b[i]=Math.floor(Math.random()*256);
    v="g_"+Array.prototype.map.call(b,function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
    try{ localStorage.setItem(k,v); }catch(e){}
    return v;
  }
  function scope(){
    var a=null; try{ a=localStorage.getItem("medinote:authscope"); }catch(e){}
    if(/^u_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(a||"")) return a;
    return devToken();
  }

  window.MediNoteKV={
    url:SB_URL, key:SB_KEY, rpc:rpc,
    scope:scope,
    reportKey:function(){ return "medinote:report:"+scope(); },
    sentKey:function(){ return "medinote:reports_sent:"+scope(); },
    // 읽기 허용 키: medinote:cards · medinote:rx · medit:rx · medinote:report:* · medinote:reports_sent:*
    get:function(k){ return rpc("kv_get",{p_key:k}); },
    getMany:function(keys){ return rpc("kv_get_many",{p_keys:keys}); },
    // 쓰기 허용 키: medinote:report:* · medinote:reports_sent:* (256KB 상한)
    put:function(k,v){ return rpc("kv_put",{p_key:k,p_value:v}).then(function(ok){ return ok===true; }); },
    setSession:function(x){ session=x||null; },
    session:function(){ return session; },
    token:function(){ return (session&&session.access_token)||null; },
    userId:function(){ return (session&&session.user&&session.user.id)||null; },
    headers:function(){ var tok=(session&&session.access_token)||SB_KEY;
      return {apikey:SB_KEY,Authorization:"Bearer "+tok}; }
  };
})();
</script>

      var r = await fetch(kv.url + "/rest/v1/health_profiles", {

        { headers: kv.headers() });
      if(!r.ok) return null;
      var rows = await r.json();
      var row = rows && rows[0];
      if(!row || !row.birth) return null;

        name: row.name || "",

  window.addEventListener("medinote:uid", function(e){

  });

<!-- ===== MediNote 접종 알림 웹푸시 구독 (기존 UI 변경 없음) ===== -->
<script>
(function(){
  "use strict";
  var SB_URL=window.MEDINOTE_CONFIG.url;
  var SB_KEY=window.MEDINOTE_CONFIG.key;
  // ↓↓↓ 웹푸시 VAPID '공개키'를 발급받아 여기에 붙여넣으세요(가이드 참고). 비어 있으면 브라우저 알림 권한만 요청합니다.
  var VAPID_PUBLIC="";
  function b64ToU8(s){ var pad="=".repeat((4-s.length%4)%4); var b=(s+pad).replace(/-/g,"+").replace(/_/g,"/"); var raw=atob(b); var a=new Uint8Array(raw.length); for(var i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i); return a; }
  async function subscribe(){
    try{
      // API 가 있는지만 보면 부족합니다. 패키징한 앱은 file:// 로 열리는데, 거기서는
      // serviceWorker·PushManager 가 둘 다 있다고 나오면서 등록만 거부됩니다(origin 'null').
      var secure = (location.protocol==="https:") || location.hostname==="localhost" || location.hostname==="127.0.0.1";
      if(!("serviceWorker" in navigator)||!("PushManager" in window)||!secure){ alert("이 브라우저는 푸시 알림을 지원하지 않습니다 (Android Chrome 권장)."); return; }
      var perm=await Notification.requestPermission();
      if(perm!=="granted"){ alert("알림을 받으려면 알림 권한을 허용해 주세요."); return; }
      if(!VAPID_PUBLIC){ alert("알림 권한을 켰습니다. 실제 접종 알림 발송은 서버 설정(VAPID 키)을 넣으면 동작합니다."); return; }
      // ready 는 활성 워커가 생길 때까지 기다리는 약속입니다. 등록이 불가능한 곳에서는
      // 거부되지 않고 영원히 멈춥니다 — try/catch 에도 안 걸립니다. 그래서 시한을 둡니다.
      var reg=await Promise.race([
        navigator.serviceWorker.ready,
        new Promise(function(r){ setTimeout(function(){ r(null); }, 5000); })
      ]);
      if(!reg){ alert("이 브라우저는 푸시 알림을 지원하지 않습니다 (Android Chrome 권장)."); return; }
      var sub=await reg.pushManager.getSubscription();
      if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToU8(VAPID_PUBLIC)});
      var ok=await window.MediNoteKV.rpc("push_subscribe",{p_endpoint:sub.endpoint, p_sub:sub.toJSON()});
      if(ok!==true){ alert("알림 등록이 거부됐습니다. 잠시 후 다시 시도해 주세요."); return; }
      alert("접종 시기 알림을 켰습니다. 예정일 2주 전·3일 전에 알려드립니다.");
    }catch(e){ alert("알림 설정 실패: "+(e.message||e)); }
  }
  document.addEventListener("click",function(e){
    try{ var n=e.target,d=0; while(n&&d<6){ var t=(n.textContent||""); if(t.length<70&&/(접종 시기 알림|접종 알림)/.test(t)){ subscribe(); return; } n=n.parentElement; d++; } }catch(_){}
  },true);
  window.MediNotePush={ subscribe:subscribe };
})();
</script>

      '<div id="mnsy-rxwrap"><input id="mnsy-rx" placeholder="복용 중인 약 (자동 채움)">'+
        '<button id="mnsy-ai" type="button">AI 채움</button></div>'+
      '<div id="mnsy-hint"></div>'+
      '<label>메모 <span style="font-weight:600;color:#8FA6A2">· 선택</span></label>'+
      '<textarea id="mnsy-memo" placeholder="언제부터, 어떤 상황에서 그런지 등"></textarea>'+
      '<button id="mnsy-save">이 증상 기록하기</button>'+
      '<button id="mnsy-toreport" type="button" style="width:100%;margin-top:9px;font-family:inherit;font-weight:800;font-size:14px;color:#0A7168;background:#fff;border:1.5px solid #E1F1EE;border-radius:14px;padding:12px 0;cursor:pointer;">기록으로 신고·공유하기</button>'+
      '<div id="mnsy-st"></div>'+
      '<div id="mnsy-list"></div>'+
      '<div id="mnsy-foot">MediNote · 정보 제공·상담 연결까지만, 판정·처방은 하지 않습니다<br>처방은 의사, 조제·상담은 약사와 상의해 주세요.</div>';
    document.body.appendChild(back); document.body.appendChild(sheet);

    // 심각도 칩
    var sv=el("mnsy-sev");
    SEV.forEach(function(o){ var b=document.createElement("button"); b.textContent=o.k; b.dataset.k=o.k;
      if(o.k===sev) b.className="sel";
      b.onclick=function(){ sev=o.k; Array.prototype.forEach.call(sv.children,function(c){c.className=(c.dataset.k===sev)?"sel":"";}); };
      sv.appendChild(b); });

    el("mnsy-date").value=todayStr();
    el("mnsy-x").onclick=close; back.onclick=close;
    el("mnsy-ai").onclick=aiFill;
    el("mnsy-save").onclick=save;
    el("mnsy-toreport").onclick=function(){ close(); if(window.MediNoteReport) window.MediNoteReport.open(); };
  }

  function open(){
    build();
    loadMeds();      // QR 복약정보 히스토리 → 관련약 자동채움
    loadRecords();
    el("mnsy-back").classList.add("on");
    requestAnimationFrame(function(){ el("mnsy-sheet").classList.add("on"); });
  }
  function close(){ el("mnsy-sheet").classList.remove("on"); el("mnsy-back").classList.remove("on"); }

  // ── QR 약봉투(복약정보) 히스토리 로드 → 약 이름 추출 ──
  function extractMeds(val){
    var out=[];
    function pushName(x){ if(!x) return; var n=(typeof x==="string")?x:(x.name||x.med||x.drug||x.title||x.제품명||x.약품명||""); n=String(n).trim(); if(n && out.indexOf(n)===-1) out.push(n); }
    try{
      if(Array.isArray(val)) val.forEach(function(row){
        if(row && Array.isArray(row.meds)) row.meds.forEach(pushName);
        else if(row && Array.isArray(row.items)) row.items.forEach(pushName);
        else pushName(row);
      });
      else if(val && Array.isArray(val.history)) val.history.forEach(function(h){ (h.meds||h.items||[]).forEach(pushName); if(!h.meds&&!h.items) pushName(h); });
      else if(val && Array.isArray(val.meds)) val.meds.forEach(pushName);
      else if(val && Array.isArray(val.rx)) val.rx.forEach(pushName);
    }catch(e){}
    return out;
  }
  function loadMeds(){
    meds=[];
    // 1) 로컬(localStorage)에서 먼저 (오프라인·즉시)
    try{ RX_KEYS.forEach(function(k){ var s=localStorage.getItem(k); if(s){ try{ meds=meds.concat(extractMeds(JSON.parse(s))); }catch(e){} } }); }catch(e){}
    fillRx();
    // 2) Supabase에서 히스토리 가져와 보강
    try{
      window.MediNoteKV.getMany(RX_KEYS)
        .then(function(map){ RX_KEYS.forEach(function(k){ var v=map&&map[k]; if(!v) return;
          extractMeds(v).forEach(function(m){ if(meds.indexOf(m)===-1) meds.push(m); }); }); fillRx(); })
        .catch(function(){});
    }catch(e){}
  }
  function fillRx(){
    var inp=el("mnsy-rx"); if(!inp) return;
    if(meds.length && !inp.value){ inp.value=meds.slice(0,4).join(", "); }
    var h=el("mnsy-hint");
    if(h) h.innerHTML = meds.length
      ? ('복약정보 히스토리에서 <b>'+meds.length+'개</b> 약을 찾았어요. [AI 채움]을 누르면 오늘 증상과 관련 있는 약만 골라 정리해 드려요.')
      : '복약정보(QR 약봉투) 기록이 아직 없어요. 약 이름을 직접 적으셔도 됩니다.';
  }

  // ── AI 자동채움: 증상 + 복약 히스토리 → 관련약·메모 (카드 처리 없이 [[NOCARD]]) ──
  function aiFill(){
    var sym=(el("mnsy-sym").value||"").trim();
    if(!meds.length && !sym){ el("mnsy-hint").innerHTML='먼저 <b>증상</b>을 적어 주시면, 관련 있는 약을 더 잘 골라 드려요.'; return; }
    var btn=el("mnsy-ai"); btn.disabled=true; var old=btn.textContent; btn.textContent="채우는 중…";
    var sysP="[[NOCARD]] 너는 복약 기록 정리 도우미다. 처방·진단은 하지 않는다. "+
      "사용자의 오늘 증상과 복용 약 목록을 보고, 그 증상과 관련 있을 만한 약만 골라 관련약으로 정리한다. "+
      "판정·처방 표현은 쓰지 않는다. 반드시 아래 JSON 하나만 출력한다(코드펜스·다른 말 없이). "+
      '스키마: {"med":"관련 약 이름들(쉼표로, 없으면 전체에서 대표 몇 개)","note":"참고용 한 문장(담백한 존댓말, 마지막은 약사·의사 상담 권유)"}';
    var usr="오늘 증상: "+(sym||"(미입력)")+"\n복용 중인 약(복약정보 히스토리): "+(meds.length?meds.join(", "):"(기록 없음)");
    var body={model:"claude-fable-5",max_tokens:400,system:sysP,messages:[{role:"user",content:usr}]};
    fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){ return r.json(); })
      .then(function(d){
        var t=""; try{ t=(d.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n"); }catch(e){}
        var o=null; try{ o=JSON.parse(t.replace(/```json|```/g,"").trim()); }catch(e){}
        if(o && (o.med||o.note)){
          if(o.med) el("mnsy-rx").value=o.med;
          el("mnsy-hint").innerHTML= esc(o.note||"관련 약을 정리했어요. 최종 판단은 약사·의사와 상의해 주세요.");
        }else{
          // AI 실패 시 히스토리 원문으로 채움(끊김 없이)
          if(meds.length && !el("mnsy-rx").value) el("mnsy-rx").value=meds.join(", ");
          el("mnsy-hint").innerHTML='복약정보 기록으로 채웠어요. 관련 약만 남기고 다듬어 주세요.';
        }
      })
      .catch(function(){
        if(meds.length && !el("mnsy-rx").value) el("mnsy-rx").value=meds.join(", ");
        el("mnsy-hint").innerHTML='지금은 AI 연결이 어려워, 복약정보 기록으로 채웠어요.';
      })
      .then(function(){ btn.disabled=false; btn.textContent=old; });
  }

  // ── 저장 (로컬 우선 → Supabase 동기화) ──
  function currentRec(){
    return { date:el("mnsy-date").value||todayStr(), severity:sev,
      symptom:(el("mnsy-sym").value||"").trim(), meds:(el("mnsy-rx").value||"").trim(),
      memo:(el("mnsy-memo").value||"").trim(), ts:new Date().toISOString() };
  }
  function save(){
    var rec=currentRec();
    if(!rec.symptom){ el("mnsy-st").textContent="증상을 한 가지만 적어 주세요."; return; }
    records.unshift(rec);
    try{ localStorage.setItem(REPORT_KEY(), JSON.stringify(records)); }catch(e){}
    renderList();
    el("mnsy-st").textContent="기록했어요. 저장 중…";
    // 입력 초기화(정도·날짜는 유지)
    el("mnsy-sym").value=""; el("mnsy-memo").value="";
    try{
      window.MediNoteKV.put(REPORT_KEY(),{records:records})
        .then(function(ok){ el("mnsy-st").textContent=ok?"저장 완료 · 기기와 클라우드에 안전하게 담겼어요.":"기기에 저장했어요(클라우드는 다음에 동기화)."; })
        .catch(function(){ el("mnsy-st").textContent="기기에 저장했어요(오프라인)."; });
    }catch(e){ el("mnsy-st").textContent="기기에 저장했어요."; }
  }

  function loadRecords(){
    records=[];
    try{ var s=localStorage.getItem(REPORT_KEY()); if(s){ var v=JSON.parse(s); records=Array.isArray(v)?v:(v.records||[]); } }catch(e){}
    renderList();
    try{
      window.MediNoteKV.get(REPORT_KEY())
        .then(function(v){ if(v&&Array.isArray(v.records)){ records=v.records; try{ localStorage.setItem(REPORT_KEY(),JSON.stringify(records)); }catch(e){} renderList(); } })
        .catch(function(){});
    }catch(e){}
  }
  function renderList(){
    var box=el("mnsy-list"); if(!box) return;
    if(!records.length){ box.innerHTML=""; return; }
    box.innerHTML='<div style="font-size:12.5px;font-weight:800;color:#0A7168;margin:6px 2px 8px">최근 기록 '+records.length+'건</div>'+
      records.slice(0,8).map(function(r){
        var o=SEV.filter(function(x){return x.k===r.severity;})[0]||SEV[1];
        return '<div class="it"><div class="r1"><span class="dt">'+esc(r.date)+'</span>'+
          '<span class="bg" style="background:'+o.bg+';color:'+o.c+'">'+esc(r.severity)+'</span></div>'+
          '<div class="sy">'+esc(r.symptom)+'</div>'+
          (r.meds?'<div class="mx">관련약 · '+esc(r.meds)+'</div>':'')+
          (r.memo?'<div class="mx">'+esc(r.memo)+'</div>':'')+'</div>';
      }).join("");
  }

  // ── "증상 기록" 텍스트 클릭 → 시트 오픈 (기존 UI 그대로, 오버레이만 추가) ──
  document.addEventListener("click",function(e){
    var t=e.target;
    // 시트/오버레이 내부 클릭(닫기·헤더 등)은 훅에서 제외 → 닫힘 방해 안 함
    if(t && t.closest && t.closest("#mnsy-sheet, #mnsy-back")) return;
    var hop=0;
    while(t && hop<4){
      if(t.id==="mnsy-sheet"||t.id==="mnsy-back") return;
      var tx=(t.textContent||"").trim();
      if(tx && tx.length<40 && /(증상\s*기록|오늘\s*증상)/.test(tx)){ e.preventDefault(); open(); return; }
      t=t.parentElement; hop++;
    }
  },true);

  window.MediNoteSymptom={ open:open, close:close, records:function(){return records;}, meds:function(){return meds;} };

  // 도우미가 "Nick님 정보에 맞춰" 답하려면 앱에 남은 기록을 함께 보내야 한다.
  // 프록시(ai-helper)가 이 값을 근거 블록으로 만들어 시스템 프롬프트에 붙인다.
  window.MediNoteHelperContext = function(){
    var out = {};
    try{
      var rs = (records || []).slice(0, 8).map(function(r){
        return [r.date, r.symptom, r.severity && ("정도 " + r.severity), r.memo].filter(Boolean).join(" · ");
      });
      if(rs.length) out.symptoms = rs;
      if(meds && meds.length) out.meds = meds.slice(0, 20);
    }catch(e){}
    try{ var u = localStorage.getItem("medinote:uid"); if(u && u !== "guest") out.profile = "계정 " + u; }catch(e){}
    return out;
  };
})();
</script>

  border-radius:22px 22px 0 0;box-shadow:0 -18px 50px rgba(6,65,62,.24);transform:translateY(102%);transition:transform .28s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;overflow:hidden;}
#mnrp-wrap.on{transform:translateY(0);}
#mnrp-bar{display:flex;align-items:center;gap:9px;padding:12px 16px calc(12px);background:#fff;border-bottom:1px solid #E1F1EE;flex-shrink:0;}
#mnrp-bar .gp{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:42px;height:5px;border-radius:5px;background:#D8E9E6;}
#mnrp-bar .tt{font-family:'Gaegu',cursive;font-weight:700;font-size:19px;color:#0A7168;}
#mnrp-bar .cl{margin-left:auto;border:none;background:#F1FAF9;color:#5A716D;width:34px;height:34px;border-radius:11px;font-size:18px;cursor:pointer;}
#mnrp-frame{flex:1;width:100%;border:none;background:#e9f7f4;}
</style>
<script>
(function(){
  "use strict";
  var built=false;
  function build(){
    if(built) return; built=true;
    var back=document.createElement("div"); back.id="mnrp-back";
    var wrap=document.createElement("div"); wrap.id="mnrp-wrap";
    wrap.innerHTML=
      '<div id="mnrp-bar"><span class="gp"></span><span class="tt">증상 신고·공유</span>'+
        '<button class="cl" id="mnrp-x" aria-label="닫기">×</button></div>'+
      '<iframe id="mnrp-frame" title="증상 신고·공유" allow="geolocation; clipboard-write; clipboard-read"></iframe>';
    document.body.appendChild(back); document.body.appendChild(wrap);
    document.getElementById("mnrp-x").onclick=close; back.onclick=close;
  }
  function open(){
    build();
    var fr=document.getElementById("mnrp-frame");
    if(!fr.getAttribute("data-loaded")){ try{ fr.srcdoc=new TextDecoder().decode(Uint8Array.from(atob(window.__MNRP_SRC),function(c){return c.charCodeAt(0);})); fr.setAttribute("data-loaded","1"); }catch(e){ fr.setAttribute("src","증상신고_공유.html"); } }
    document.getElementById("mnrp-back").classList.add("on");
    requestAnimationFrame(function(){ document.getElementById("mnrp-wrap").classList.add("on"); });
  }
  function close(){
    var w=document.getElementById("mnrp-wrap"), b=document.getElementById("mnrp-back");
    if(w) w.classList.remove("on"); if(b) b.classList.remove("on");
  }

  // "이상반응 신고 / 증상 신고·공유 / 공유하기" 텍스트 클릭 → 오버레이 오픈
  document.addEventListener("click",function(e){
    var t=e.target;
    if(t && t.closest && t.closest("#mnrp-wrap, #mnrp-back, #mnsy-sheet, #mnsy-back")) return; // 내부/증상시트 제외
    var hop=0;
    while(t && hop<4){
      if(t.id==="mnrp-wrap"||t.id==="mnrp-back") return;
      var tx=(t.textContent||"").trim();
      if(tx && tx.length<40 && /(이상반응\s*신고|증상\s*신고|신고\s*·?\s*공유|증상\s*공유|공유하기)/.test(tx)){ e.preventDefault(); open(); return; }
      t=t.parentElement; hop++;
    }
  },true);

  window.MediNoteReport={ open:open, close:close };
})();
</script>
<!-- ===== /증상 신고·공유 레이어 ===== -->

<!-- ===== 앱 설치(다운로드) 레이어 ===== -->
<style>
#mnin-bar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:456px;margin:0 auto;z-index:100050;
  background:#fff;border:1px solid #E1F1EE;border-radius:16px;box-shadow:0 16px 40px rgba(6,65,62,.18);
  padding:12px 14px;display:none;align-items:center;gap:12px;font-family:'Pretendard',-apple-system,sans-serif;}
#mnin-bar.on{display:flex;}
#mnin-bar .ic{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#12BDB0,#0A7168);color:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
#mnin-bar .ic svg{width:22px;height:22px;}
#mnin-bar .tx{flex:1;min-width:0;}
#mnin-bar .tx .a{font-size:13.5px;font-weight:800;color:#122423;letter-spacing:-.01em;}
#mnin-bar .tx .b{font-size:11.5px;color:#5A716D;margin-top:1px;}
#mnin-bar .go{border:none;background:linear-gradient(135deg,#12BDB0,#0A7168);color:#fff;font-family:inherit;font-weight:800;font-size:13px;border-radius:11px;padding:10px 14px;cursor:pointer;white-space:nowrap;box-shadow:0 6px 14px rgba(18,189,176,.28);}
#mnin-bar .cl{border:none;background:transparent;color:#8FA6A2;font-size:20px;cursor:pointer;width:26px;height:26px;flex-shrink:0;}
#mnin-ios{position:fixed;inset:0;z-index:100060;background:rgba(6,65,62,.4);display:none;align-items:flex-end;justify-content:center;}
#mnin-ios.on{display:flex;}
#mnin-ios .sh{background:#fff;max-width:456px;width:calc(100% - 24px);margin:0 12px 18px;border-radius:18px;padding:18px;font-family:'Pretendard',sans-serif;text-align:center;}
#mnin-ios .sh h4{font-size:16px;font-weight:800;color:#122423;margin-bottom:8px;}
#mnin-ios .sh p{font-size:13px;color:#5A716D;line-height:1.6;}
#mnin-ios .sh b{color:#0A7168;}
#mnin-ios .sh button{margin-top:14px;border:none;background:#F1FAF9;color:#0A7168;font-family:inherit;font-weight:800;font-size:14px;border-radius:12px;padding:11px 20px;cursor:pointer;}
</style>
<script>
(function(){
  "use strict";
  function standalone(){ return window.matchMedia && window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true; }
  function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
  var dismissed=false;
  try{ dismissed = localStorage.getItem("medinote:installhide")==="1"; }catch(e){}

  function buildBar(){
    if(document.getElementById("mnin-bar")) return;
    var bar=document.createElement("div"); bar.id="mnin-bar";
    bar.innerHTML=
      '<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></div>'+
      '<div class="tx"><div class="a">MediNote 앱 설치</div><div class="b">홈 화면에 추가해 앱처럼 바로 여세요</div></div>'+
      '<button class="go" id="mnin-go">설치</button>'+
      '<button class="cl" id="mnin-x" aria-label="닫기">×</button>';
    document.body.appendChild(bar);
    document.getElementById("mnin-go").onclick=doInstall;
    document.getElementById("mnin-x").onclick=function(){ hide(); try{ localStorage.setItem("medinote:installhide","1"); }catch(e){} };
    var ios=document.createElement("div"); ios.id="mnin-ios";
    ios.innerHTML='<div class="sh"><h4>홈 화면에 추가</h4><p>사파리 아래 <b>공유</b> 버튼을 누른 뒤<br><b>‘홈 화면에 추가’</b>를 선택하세요.</p><button id="mnin-iosok">확인</button></div>';
    document.body.appendChild(ios);
    ios.onclick=function(e){ if(e.target===ios||e.target.id==="mnin-iosok") ios.classList.remove("on"); };
  }
  function show(){ if(standalone()) return; buildBar(); document.getElementById("mnin-bar").classList.add("on"); }
  function hide(){ var b=document.getElementById("mnin-bar"); if(b) b.classList.remove("on"); }
  function doInstall(){
    var e=window.__mnInstall;
    if(e && e.prompt){ e.prompt(); if(e.userChoice){ e.userChoice.then(function(){ window.__mnInstall=null; hide(); }); } else hide(); return; }
    if(isIOS()){ document.getElementById("mnin-ios").classList.add("on"); return; }
    hide();
  }

  // 설치 가능 신호가 오면 배너 표시
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); window.__mnInstall=e; if(!dismissed) show(); });
  window.addEventListener("appinstalled", function(){ hide(); window.__mnInstall=null; });

  // 이미 잡혀 있으면(부트 스크립트) 바로 표시 / iOS는 안내형으로 표시
  setTimeout(function(){ if(standalone()||dismissed) return; if(window.__mnInstall || isIOS()) show(); }, 1200);

  window.MediNoteInstall={ show:show, hide:hide, install:doInstall };
})();
</script>

  var SB_KEY=window.MEDINOTE_CONFIG.key;
  var sb=null, user=null, built=false, authMode="login";
  // 세션을 공용 계층과 나눠 쓴다 — RPC·measurements 쓰기가 익명 대신 본인으로 나간다
  /* 구글이 내준 생년월일을 읽는다. 연도가 없으면(비공개로 둔 계정이 많다) 쓸 수 없으므로
     null 을 돌려주고, 그러면 앱이 평소처럼 한 번 여쭙는다. */
  async function googleBirthday(providerToken){
    if(!providerToken) return null;
    try{
      var r = await fetch("https://people.googleapis.com/v1/people/me?personFields=birthdays",
        { headers: { Authorization: "Bearer " + providerToken } });
      if(!r.ok) return null;
      var d = await r.json();
      var list = (d && d.birthdays) || [];
      var best = null;
      for(var i=0;i<list.length;i++){
        var b = list[i], dt = b && b.date;
        if(!dt || !dt.year || !dt.month || !dt.day) continue;   // 연도 없으면 못 쓴다
        var src = b.metadata && b.metadata.source && b.metadata.source.type;
        if(src === "ACCOUNT"){ best = dt; break; }              // 계정에 등록된 값 우선
        if(!best) best = dt;
      }
      if(!best) return null;
      function p2(n){ return (n<10?"0":"")+n; }
      return best.year + "-" + p2(best.month) + "-" + p2(best.day);
    }catch(e){ return null; }
  }

  function adoptGoogleBirthday(s){
    try{
      var pt = s && s.provider_token;
      if(!pt || !window.MediNoteProfile) return;
      if(window.MediNoteProfile.cached()) return;   // 이미 있으면 덮어쓰지 않는다
      googleBirthday(pt).then(function(birth){
        if(!birth) return;
        var u = s.user || {}, meta = u.user_metadata || {};
        var prof = {
          name: meta.name || meta.full_name || (u.email ? String(u.email).split("@")[0] : ""),
          birth: birth,
          conditions: []
        };
        window.MediNoteProfile.save(prof);
        try{ window.dispatchEvent(new CustomEvent("medinote:profile",{ detail: prof })); }catch(e){}
      });
    }catch(e){}
  }

  function share(s){
    try{ if(window.MediNoteKV) window.MediNoteKV.setSession(s||null); }catch(e){}
    adoptGoogleBirthday(s);
    // 리포트 스코프를 같은 오리진의 다른 페이지(증상신고·오늘기록)와 공유한다
    try{
      var id=s&&s.user&&s.user.id;
      if(id) localStorage.setItem("medinote:authscope","u_"+id);
      else localStorage.removeItem("medinote:authscope");
    }catch(e){}
  }
  function el(id){ return document.getElementById(id); }
  function uid(){ try{ return localStorage.getItem("medinote:uid")||"guest"; }catch(e){ return "guest"; } }
  function setUid(v){ v=(v&&String(v).trim())||"guest"; try{ localStorage.setItem("medinote:uid",v); }catch(e){}
    try{ window.dispatchEvent(new CustomEvent("medinote:uid",{detail:v})); }catch(e){} paint(); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];}); }

  function build(){
    if(built) return; built=true;
    var pill=document.createElement("div"); pill.id="mnlg-pill";
    pill.innerHTML='<span class="av" id="mnlg-av">?</span><span class="nm" id="mnlg-nm">로그인</span>';
    pill.onclick=open; document.body.appendChild(pill);
    var back=document.createElement("div"); back.id="mnlg-back";
    var sheet=document.createElement("div"); sheet.id="mnlg-sheet";
    sheet.innerHTML=
      '<div class="gp"></div>'+
      '<button id="mnlg-x" type="button" aria-label="\uB2EB\uAE30">\u00D7</button>'+
      '<div class="hd" id="mnlg-hd">로그인</div>'+
      '<div class="sub" id="mnlg-sub">이메일로 로그인하거나 회원가입하세요. 기록이 계정에 안전하게 저장됩니다.</div>'+
      '<div id="mnlg-cur"></div>'+
      '<div id="mnlg-forms">'+
        '<div class="mnlg-tabs"><button id="mnlg-tab-login" class="on">로그인</button><button id="mnlg-tab-signup">회원가입</button></div>'+
        '<input id="mnlg-name" placeholder="이름" autocomplete="name" style="display:none">'+
        '<input id="mnlg-email" type="email" placeholder="이메일" autocomplete="email">'+
        '<input id="mnlg-pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">'+
        '<button id="mnlg-submit">로그인</button>'+
        '<div id="mnlg-status"></div>'+
        '<div class="mnlg-or">간편 로그인</div>'+
        '<button class="mnlg-g" id="mnlg-google"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.76h3.56c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.76c-.98.66-2.23 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.11a6.6 6.6 0 0 1 0-4.22V7.05H2.18a11 11 0 0 0 0 9.9l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.05l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>Google로 계속</button>'+
        '<button id="mnlg-quicktoggle" class="mnlg-link">이메일 없이 아이디로 빠른 체험</button>'+
        '<div id="mnlg-quick" style="display:none"><input id="mnlg-id" placeholder="아이디 (예: hjshin)" autocomplete="off"><button id="mnlg-start" class="mnlg-2nd">이 아이디로 시작</button></div>'+
      '</div>'+
      '<button id="mnlg-out">로그아웃</button>'+
      '<div id="mnlg-gerr"></div>'+
      '<div id="mnlg-note">가입 시 이메일 인증이 켜져 있으면, 메일의 인증 링크를 누른 뒤 로그인하세요.</div>';
    document.body.appendChild(back); document.body.appendChild(sheet);
    back.onclick=close;
    el("mnlg-tab-login").onclick=function(){ setMode("login"); };
    el("mnlg-tab-signup").onclick=function(){ setMode("signup"); };
    el("mnlg-submit").onclick=submitAuth;
    el("mnlg-pw").addEventListener("keydown",function(e){ if(e.key==="Enter") submitAuth(); });
    el("mnlg-google").onclick=googleLogin;
    el("mnlg-quicktoggle").onclick=function(){ var q=el("mnlg-quick"); q.style.display=(q.style.display==="none")?"block":"none"; };
    el("mnlg-start").onclick=function(){ var v=(el("mnlg-id").value||"").trim().replace(/\s+/g,""); if(!v){ el("mnlg-id").focus(); return; } setUid(v); close(); };
    el("mnlg-out").onclick=logout;
    el("mnlg-x").onclick=close;
  }
  function open(){ build(); paint(); document.getElementById("mnlg-back").classList.add("on"); requestAnimationFrame(function(){ document.getElementById("mnlg-sheet").classList.add("on"); }); }
  function close(){ var s=document.getElementById("mnlg-sheet"),b=document.getElementById("mnlg-back"); if(s)s.classList.remove("on"); if(b)b.classList.remove("on"); }

  function paint(){
    if(!built) return;
    var u=uid(), loggedin=(u!=="guest");
    var name = user ? ((user.user_metadata&&(user.user_metadata.name||user.user_metadata.full_name))||user.email||u) : u;
    el("mnlg-nm").textContent = loggedin ? name : "로그인";
    el("mnlg-av").textContent = loggedin ? String(name).slice(0,1).toUpperCase() : "?";
    var cur=el("mnlg-cur"), forms=el("mnlg-forms"), out=el("mnlg-out");
    if(loggedin){ cur.classList.add("on"); cur.innerHTML="현재 로그인 · <b>"+esc(name)+"</b>"; if(forms) forms.style.display="none"; if(out) out.classList.add("on");
      if(el("mnlg-hd")) el("mnlg-hd").textContent="내 계정"; if(el("mnlg-sub")) el("mnlg-sub").textContent="로그인 상태입니다. 기록이 이 계정에 저장됩니다."; }
    else { cur.classList.remove("on"); if(forms) forms.style.display="block"; if(out) out.classList.remove("on"); }
  }

  function status(msg,isErr){ var s=el("mnlg-status"); if(!s) return; if(!msg){ s.className=""; s.textContent=""; return; } s.className=isErr?"err":"ok"; s.textContent=msg; }
  function setMode(m){ authMode=m;
    if(el("mnlg-tab-login")) el("mnlg-tab-login").classList.toggle("on",m==="login");
    if(el("mnlg-tab-signup")) el("mnlg-tab-signup").classList.toggle("on",m==="signup");
    if(el("mnlg-name")) el("mnlg-name").style.display=(m==="signup")?"block":"none";
    if(el("mnlg-submit")) el("mnlg-submit").textContent=(m==="signup")?"회원가입":"로그인";
    if(el("mnlg-hd")) el("mnlg-hd").textContent=(m==="signup")?"회원가입":"로그인";
    status("");
  }
  function mapErr(m){ m=String(m||"");
    if(/already registered|already exists|User already/i.test(m)) return "이미 가입된 이메일입니다. 로그인해 주세요.";
    if(/Invalid login|invalid credentials|Invalid email or password/i.test(m)) return "이메일 또는 비밀번호가 올바르지 않습니다.";
    if(/Email not confirmed/i.test(m)) return "이메일 인증이 필요합니다. 메일의 인증 링크를 눌러 주세요.";
    if(/at least/i.test(m)) return "비밀번호는 6자 이상이어야 합니다.";
    return m; }
  function submitAuth(){
    if(!sb){ status("로그인 모듈 로딩 중입니다. 잠시 후 다시 시도하세요.", true); return; }
    var email=(el("mnlg-email").value||"").trim(), pw=(el("mnlg-pw").value||"");
    if(email.indexOf("@")<1){ status("이메일을 정확히 입력하세요.", true); el("mnlg-email").focus(); return; }
    if(pw.length<6){ status("비밀번호는 6자 이상이어야 합니다.", true); el("mnlg-pw").focus(); return; }
    var btn=el("mnlg-submit"); btn.disabled=true; var old=btn.textContent; btn.textContent="처리 중…";
    var done=function(){ btn.disabled=false; btn.textContent=old; };
    if(authMode==="signup"){
      var name=(el("mnlg-name").value||"").trim();
      sb.auth.signUp({email:email,password:pw,options:{data:{name:name}}})
        .then(function(r){ if(r.error){ status(mapErr(r.error.message),true); }
          else if(r.data&&r.data.session){ status("가입 완료! 자동 로그인되었습니다.",false); setTimeout(close,800); }
          else { status("가입 완료! 이메일로 보낸 인증 링크를 누른 뒤 로그인하세요.",false); setMode("login"); } })
        .catch(function(){ status("가입 중 오류가 발생했습니다.",true); }).then(done);
    } else {
      sb.auth.signInWithPassword({email:email,password:pw})
        .then(function(r){ if(r.error){ status(mapErr(r.error.message),true); } else { status("로그인되었습니다.",false); setTimeout(close,500); } })
        .catch(function(){ status("로그인 중 오류가 발생했습니다.",true); }).then(done);
    }
  }

  function gerr(msg){ var e=document.getElementById("mnlg-gerr"); if(e){ e.classList.add("on"); e.innerHTML=msg; } }
  function googleLogin(){
    var e=document.getElementById("mnlg-gerr"); if(e) e.classList.remove("on");
    if(location.protocol==="file:"){ gerr("파일을 직접 연 상태(file://)에서는 Google 로그인이 안 됩니다. <b>배포한 https 주소</b>에서 열어 주세요."); return; }
    if(location.protocol!=="https:" && location.hostname!=="localhost"){ gerr("Google 로그인은 <b>https</b> 주소에서만 됩니다."); return; }
    if(!sb){ gerr("로그인 모듈을 불러오는 중입니다. 잠시 후 다시 눌러 주세요."); return; }
    try{
      sb.auth.signInWithOAuth({provider:"google",options:{
        redirectTo:location.href.split("#")[0],
        // 연령대 안내에 쓸 생년월일을 함께 요청한다. 민감 스코프라 구글 콘솔에서
        // People API 사용 설정과 동의 화면 스코프 추가가 되어 있어야 한다.
        scopes:"https://www.googleapis.com/auth/user.birthday.read",
        queryParams:{ access_type:"offline", prompt:"consent" }
      }})
        .then(function(r){ if(r&&r.error){ gerr("Google 공급자 설정이 필요합니다 (관리자 1회): <b>"+esc(r.error.message||"provider not enabled")+"</b><br>Supabase → Authentication → Providers → <b>Google 켜기</b> + Redirect URL 등록이 필요합니다."); } })
        .catch(function(){ gerr("로그인을 시작할 수 없습니다. 잠시 후 다시 시도하거나 본인 아이디로 로그인하세요."); });
    }catch(err){ gerr("로그인을 시작할 수 없습니다. 본인 아이디로 로그인해 주세요."); }
  }
  function logout(){ if(sb&&user){ sb.auth.signOut().then(function(){ user=null; setUid("guest"); close(); }); } else { user=null; setUid("guest"); close(); } }

  function initSb(){
    try{ if(window.supabase&&window.supabase.createClient){
      sb=window.supabase.createClient(SB_URL,SB_KEY);
      sb.auth.getSession().then(function(r){ var s=r&&r.data&&r.data.session; share(s); if(s&&s.user){ user=s.user; setUid(user.email||user.id); } paint(); }).catch(function(){ paint(); });
      sb.auth.onAuthStateChange(function(_e,ss){ share(ss); if(ss&&ss.user){ user=ss.user; setUid(user.email||user.id); } paint(); });
    } }catch(e){}
  }

  build(); initSb(); paint();
  window.MediNoteLogin={ open:open, close:close, setUid:setUid, uid:uid,
    google:googleLogin,
    user:function(){ return user; }, client:function(){ return sb; } };
})();
</script>
