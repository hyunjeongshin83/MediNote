     여기를 직접 고치지 마세요 — 다음 실행 때 지워집니다.
     화면을 고칠 곳은 저장소 맨 위의 MediNote_app.html 한 곳뿐입니다. -->
<html lang="ko"><head><meta charset="UTF-8">
<!-- maximum-scale·user-scalable 을 빼서 손가락으로 키워 볼 수 있게 했습니다.
     고령 사용자에게는 이것이 글자를 키우는 유일한 방법입니다 (WCAG 2.2 SC 1.4.4). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12BDB0">
<title>MediNote</title>
<!-- ===== MediNote 실제연결 레이어 (UI 변경 없음 · 기능만 추가) ===== -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MediNote">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<script>
(function(){
  // (1) PWA — 설치형/오프라인 (Play스토어 TWA용). UI에 영향 없음.
  /* 서비스워커는 패키징본에서 뺐습니다 — file:// 에서는 등록이 거부됩니다 (#16) */
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); window.__mnInstall=e; });

  // (2) AI 도우미 — 브라우저에서 Anthropic 을 직접 부르지 않는다.
  //     예전에는 사용자 각자에게 sk-ant-… 키를 물어봤는데, 어르신 사용자가 그 키를
  //     가지고 있을 리 없어 도우미가 사실상 아무에게도 작동하지 않았다. 키는 이제
  //     엣지함수(ai-helper)에만 있고, 앱은 로그인 세션으로 그 함수를 부른다.
  //     앱 곳곳의 기존 Anthropic 호출을 그대로 두고 여기서 함수 호출로 갈아끼운다.
  var _fetch = window.fetch ? window.fetch.bind(window) : null;

  function reply(text, extra){
    // 기존 코드가 Anthropic 응답 모양을 기대하므로 같은 모양으로 돌려준다.
    var body = Object.assign({ content: [{ type: "text", text: String(text || "") }] }, extra || {});
    return new Response(JSON.stringify(body), {
      status: 200, headers: { "Content-Type": "application/json; charset=utf-8" }
    });
  }

  async function viaHelper(opts){
    var cfg = window.MEDINOTE_CONFIG, kv = window.MediNoteKV;
    var token = kv && kv.token && kv.token();
    if(!token){
      return reply("도우미는 로그인 후 이용하실 수 있어요. 화면 오른쪽 위 \u201C로그인\u201D 을 눌러 주세요. "
        + "로그인하시면 남기신 기록에 맞춰 안내해 드립니다.");
    }
    // 처음 쓸 때 한 번 — 증상·복용약·프로필이 외부 AI 사업자에게 간다는 것을 확인받는다 (#22 MN-22-3).
    // 「저장되지 않습니다」는 쓰지 않는다 — Anthropic 쪽 보관 정책을 원문으로 확인하지 못했다.
    var ACK = "medinote:ai:ack";
    var acked = false; try{ acked = localStorage.getItem(ACK) === "1"; }catch(e){}
    if(!acked){
      var yes = window.confirm("AI 도우미는 답변을 만들기 위해 질문과 프로필(이름·나이대·질환) · 최근 증상 · 복용약을 외부 AI 사업자(Anthropic · 미국)에 전달합니다. 우리 서버에는 질문 본문은 남기지 않고, 로그인 계정에 묶인 하루 호출 수와 토큰 수가 남습니다.\n\n계속하시겠어요? (이 확인은 한 번만 뜹니다)");
      if(!yes) return reply("확인을 취소하셨어요. AI 도우미를 쓰지 않아도 기록·알림 기능은 그대로 쓰실 수 있습니다.");
      try{ localStorage.setItem(ACK, "1"); }catch(e){}
    }
    var sent = {};
    try{ sent = (typeof opts.body === "string") ? JSON.parse(opts.body) : (opts.body || {}); }catch(e){}

    // [[NOCARD]] 는 앱 내부 자동채움(AI 채움) 표시 — 지시문은 서버(ai-helper)에만 있고 앱은 mode 이름만 보낸다 (#44 MN-44-1).
    var sys = (typeof sent.system === "string") ? sent.system : "";
    var internal = sys.indexOf("[[NOCARD]]") > -1;

    var payload = {
      messages: (sent.messages || []).map(function(m){
        var c = m && m.content;
        if(Array.isArray(c)) c = c.map(function(b){ return (b && b.text) || ""; }).join("\n");
        return { role: m && m.role, content: String(c == null ? "" : c) };
      }),
      max_tokens: sent.max_tokens,
      web_search: !internal,
      mode: internal ? "fill" : "helper"
    };
    if(!internal && window.MediNoteHelperContext){
      try{ payload.context = window.MediNoteHelperContext(); }catch(e){}
    }

    try{
      var r = await _fetch(cfg.functionsUrl + "/" + (cfg.aiFunction || "ai-helper"), {
        method: "POST",
        headers: { Authorization: "Bearer " + token, apikey: cfg.key, "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      var d = null; try{ d = await r.json(); }catch(e){}
      if(d && d.ok) return reply(d.text, { model: d.model, sources: d.sources || [] });
      return reply((d && d.message) || ("도우미에 연결하지 못했습니다 (" + r.status + ")."));
    }catch(e){
      return reply("도우미에 연결하지 못했습니다. 네트워크를 확인해 주세요.");
    }
  }

  // 앱의 AI 호출은 전부 이 이름을 부릅니다. 전에는 window.fetch 를 가로채 「api.anthropic.com」 을 부르는 코드를
  // 서버(ai-helper)로 돌렸는데, 가로채기가 안 걸리면 건강 데이터가 열쇠도 없이 미국으로 바로 나갔습니다 (#51 MN-51-1).
  // 이제 앱 어디에도 그 주소가 없고, tools/egress-check.py 가 CI 에서 새로 들어오는 것을 막습니다 (MN-51-2).
  window.MediNoteAI = { messages: function(opts){ return viaHelper(opts || {}); } };

  // 개인 키를 받던 통로는 없앤다. 예전 키가 남아 있으면 지운다.
  try{ localStorage.removeItem("medit:apikey"); }catch(e){}
  window.MediNoteSetKey = function(){
    console.warn("[MediNote] 개인 API 키는 더 쓰지 않습니다. 도우미는 서버(ai-helper)를 통해 동작합니다.");
  };
})();
</script>

<style id="mn-tokens">
/* 태블릿 세로(700–899px)에서 430px 폰 칸이 좁아 보이지 않게 — 백신노트 PR #49 와 같은 폭 */
@media (min-width:700px) and (max-width:899px){ .mn-frame{max-width:45rem!important;} } /* 720px → 45rem: 글자를 키우면 틀도 따라 넓어집니다 (#42 MN-42-5) */
/* 앱 스타일 토큰 — VaccineNote-Park/docs/APP-STYLE.md 3-1 의 메디노트 줄과 같은 값입니다.
   값을 바꾸지 않고 이름만 붙였습니다 (#17). 나머지 색은 다음 단계에서 중립색 토큰으로. */
:root{ --brand:#0A7168; --brand-light:#12BDB0; --brand-soft:#E1F1EE; --brand-deep:#06413E; }
/* 공통 중립·상태 토큰 (APP-STYLE 3-1 값 그대로) — 비활성·오류 상태에만 씁니다 (#44 VN-44-5) */
:root{ --n-200:#D8E5E7; --n-700:#274549; --danger:#A3231B; }
  /* APP-STYLE 3-1 공통 토큰 — 값은 그대로, 이름만 붙임 (이미 같은 값으로 박혀 있던 색 자리를 var() 로) */
  :root{ --danger-bg:#FDEDE9; --n-0:#FFFFFF; --n-100:#F2F6F7; --n-500:#7E9497; --n-600:#577377; --n-900:#0F2327; --warn:#8A5A00; --warn-bg:#FBF3E2; }
/* 글자 크기 — APP-STYLE 3-2 (rem · 16px 기준 28·22·20·17·16·15·13px). html 에 font-size 를 두지 않아 사용자 설정을 따릅니다 (#42 MN-42-1) */
:root{ --fs-display:2.125rem; --fs-title:1.75rem; --fs-title2:1.375rem; --fs-headline:1.25rem; --fs-body:1.0625rem; --fs-callout:1rem; --fs-sub:.9375rem; --fs-caption:.8125rem; }
/* 모서리 5단계 — APP-STYLE 3-4. 값은 #17 MN-17-4 뒤로 쓰던 것 그대로라 보이는 변화가 없습니다 (#74 MN-74-4) */
:root{ --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-full:999px; }
/* 자간 세 단계 — APP-STYLE (제목 · 본문 · 대문자 라벨). 밖에 있던 -.03em · 0 · .02em · .026em · .08em · .09em 을 여기로 모음 (#74 MN-74-5 · 대표님 결정 2026-11-03) */
:root{ --ls-title:-0.02em; --ls-body:-0.01em; --ls-caps:0.04em; }
/* 화면 틀 폭 — APP-STYLE 3-2-2 --measure-frame. 430 · 456 · 480px 를 rem 하나로 모아 사용자가 글자를 키우면 틀도 따라 넓어집니다 (#42 MN-42-5 · VN-73-4 · 대표님 결정 2026-11-03) */
:root{ --measure-frame:30rem; }
</style>
<style id="mn-nav">
/* 하단 탭 — 세 앱 공통 선 아이콘 · 이름은 아이콘 옆 (2026-09-28 대표님 승인 아이콘 시안)
   색 (WCAG 2.x 상대휘도로 계산)
     켜짐  --brand var(--brand) : 흰 바탕 var(--n-0) 5.87:1 · 켜짐 바탕 var(--brand-soft) 5.04:1 (예전 #D8F5EF 5.10:1 · #143 MN-143-2)
     꺼짐  --n-700 var(--n-700) : 흰 바탕 var(--n-0) 10.33:1   (예전 var(--n-500) 은 3.20:1 이라 기준 미달)
   폭   5칸을 이름 옆으로 두면 360px 폰에서 칸(약 70px)이 모자라 「예방접종」·Assistant 가
        넘칩니다. 그래서 앱 칸 폭 380px 이상에서만 옆에 두고, 380px 미만에서는 이름을
        아이콘 아래로 내립니다. 앱 칸은 최대 var(--measure-frame) 30rem(기본 480px · 700–899px 에서는 45rem)이라 뷰포트 폭으로 갈립니다.
   누르는 곳 칸마다 높이 48px 이상 (44px 기준)
   380px 에서 한 칸 75.2px ≥ 아이콘 20 + 간격 6 + 「예방접종」 40 + 여백 8 = 74px (Playwright 로 잰 값) */
.mn-tab{flex:1;min-width:0;min-height:48px;background:none;border:none;padding:0;margin:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--n-700);}
.mn-tab.on{color:var(--brand);}
.mn-tab-in{display:flex;flex-direction:row;align-items:center;gap:6px;padding:6px 4px;border-radius:var(--r-md);white-space:nowrap;transition:background .2s;}
.mn-tab.on .mn-tab-in{background:var(--brand-soft);}
.mn-tab svg{width:20px;height:20px;flex-shrink:0;}
.mn-tab-t{font-size:var(--fs-caption);font-weight:600;line-height:1.2;}

   넘치므로(한 칸 85px < 91px) 폭과 상관없이 이름을 아래에 둡니다. */
.mn-nav-below .mn-tab-in{flex-direction:column;gap:4px;padding:4px 6px;}

/* 본문 스크롤 영역에 키보드 초점이 가도록 tabindex=0 을 줬다 — 초점 링이 화면 가장자리에서 잘리지 않게 안쪽으로 (MN-<이슈>-2) */

html.mn-tabs-below .mn-tab svg{width:22px;height:22px;}

<script>/* medinote.config.js */
/* ============================================================
   MediNote 접속 설정 — 프로필 DB 주소는 여기 한 곳에만 둡니다.

   다른 Supabase 프로젝트로 옮길 때는 아래 REF 와 KEY 두 줄만 고치면
   앱·증상신고·오늘기록·안내카드 페이지가 한꺼번에 따라옵니다.

   KEY 는 publishable(공개) 키입니다. 브라우저에 노출되는 것이 정상이며,
   실제 접근 통제는 행 수준 보안(RLS)과 RPC 함수가 합니다.
   시크릿 키는 절대 여기 두지 마세요.
   ============================================================ */
(function () {
  var REF = "pczprqckynukavpeylbq";
  var KEY = "sb_publishable_tkCla7hkWyB-kgr3erGh6Q_K3chh-hA";

  window.MEDINOTE_CONFIG = {
    ref: REF,
    url: "https://" + REF + ".supabase.co",
    functionsUrl: "https://" + REF + ".functions.supabase.co",
    /* AI 도우미 엣지 함수의 주소 이름(slug). 대시보드에서 함수를 만들면 Supabase 가
       bright-processor 같은 이름을 멋대로 붙이고 그 이름은 나중에 못 바꿉니다.
       프로젝트를 옮길 때 실제로 올라간 이름을 여기에 적어 주세요. */
    aiFunction: "super-service",
    key: KEY,
    /* 「빠른 체험」을 기기 번호(g_) 대신 익명 계정(signInAnonymously)으로 — #55 MN-55-1.
       true 로 바꾸기 전에 MN-55-2 정책 적용 · 대시보드에서 Anonymous sign-ins · Manual linking · Turnstile (MN-55-3). */
    anonAuth: false,
    /* 설치한 웹앱(PWA) 아이콘에 「시간이 지났는데 안 먹은 복용 수」 숫자를 — Badging API 실험 (#97 MN-97-1).
       기본 꺼짐. 켜기 전에 MN-97-2 (홈 화면에 숫자가 남에게 보임) 결정. */
    appBadge: false,
    /* 「복용했어요」를 누르면 짧게 한 번 진동 — Vibration API 실험 (#186 MN-186-1). 기본 꺼짐.
       켜기 전에 MN-186-2 (조용해야 하는 자리에서 진동이 울릴 수 있음) 결정. */
    haptic: false,
    /* 시트를 내장 <dialog>(showModal) 로 — 지금은 iOS 「홈 화면에 추가」 안내 한 곳만 (#141 MN-141-2 · 대표님 결정 2026-11-03).
       실기기 TalkBack·VoiceOver 에서 문제가 보이면 false 로 되돌리면 예전 div 시트가 그대로 뜹니다. */
    nativeDialog: true
  };
})();

</script>

<!-- ===== MediNote Supabase 공용 계층 (RPC 게이트웨이 · 세션 공유) ===== -->
<script>
(function(){
  "use strict";
  var SB_URL=window.MEDINOTE_CONFIG.url;
  var SB_KEY=window.MEDINOTE_CONFIG.key;
  var session=null;

  // hub_state 직접 호출은 익명 목록 열거를 막느라 닫혔다. 게스트가 쓰는 읽기·쓰기는
  // 전부 SECURITY DEFINER RPC 로 나가고, 키를 정확히 아는 1건씩만 응답한다.
  function rpc(fn,body){
    var tok=(session&&session.access_token)||SB_KEY;
    return fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",
      headers:{apikey:SB_KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json"},
      body:JSON.stringify(body||{})})
      .then(function(r){ if(!r.ok) throw new Error("RPC "+fn+" HTTP "+r.status); return r.json(); });
  }

  /* 리포트 키는 그 자체가 열쇠다 — 이메일이나 "guest" 는 남이 맞힐 수 있어서 열쇠가 못 된다.
     로그인하면 자기 uid(UUID, JWT로 증명), 아니면 기기마다 다른 난수 토큰을 쓴다. */
  function devToken(){
    var k="medinote:devtoken", v=null;
    try{ v=localStorage.getItem(k); }catch(e){}
    if(/^g_[0-9a-f]{32}$/.test(v||"")) return v;
    var b=new Uint8Array(16), c=window.crypto||window.msCrypto;
    if(c&&c.getRandomValues) c.getRandomValues(b);
    else for(var i=0;i<16;i++) b[i]=Math.floor(Math.random()*256);
    v="g_"+Array.prototype.map.call(b,function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
    try{ localStorage.setItem(k,v); }catch(e){}
    return v;
  }
  function scope(){
    var a=null; try{ a=localStorage.getItem("medinote:authscope"); }catch(e){}
    if(/^u_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(a||"")) return a;
    return devToken();
  }

  window.MediNoteKV={
    url:SB_URL, key:SB_KEY, rpc:rpc,
    scope:scope,
    reportKey:function(){ return "medinote:report:"+scope(); },
    sentKey:function(){ return "medinote:reports_sent:"+scope(); },
    // 읽기 허용 키: medinote:cards · medinote:rx · medit:rx · medinote:report:* · medinote:reports_sent:*
    get:function(k){ return rpc("kv_get",{p_key:k}); },
    getMany:function(keys){ return rpc("kv_get_many",{p_keys:keys}); },
    // 쓰기 허용 키: medinote:report:* · medinote:reports_sent:* (256KB 상한)
    put:function(k,v){ return rpc("kv_put",{p_key:k,p_value:v}).then(function(ok){ return ok===true; }); },
    setSession:function(x){ session=x||null; },
    session:function(){ return session; },
    token:function(){ return (session&&session.access_token)||null; },
    userId:function(){ return (session&&session.user&&session.user.id)||null; },
    headers:function(){ var tok=(session&&session.access_token)||SB_KEY;
      return {apikey:SB_KEY,Authorization:"Bearer "+tok}; }
  };
})();
</script>

  var LOCAL = "medinote:profile";

  function cached(){
    try{
      var v = JSON.parse(localStorage.getItem(LOCAL) || "null");
      if(v && v.birth) return v;
    }catch(e){}
    return null;
  }

  // 프로필이 어느 계정 것인지 함께 남긴다 — 로그아웃은 uid 만 guest 로 바꾸고 프로필은 두므로,
  // 같은 기기의 다음 사람(다른 계정·비로그인)이 앞사람의 이름·질환을 물려받아 AI 도우미로 보내게 되던 것 (PR #71 Codex P1)

  function ownedByCurrent(){
    try{ return localStorage.getItem(OWNER) === currentUid(); }catch(e){ return false; }
  }

    var kv = window.MediNoteKV, uid = kv && kv.userId && kv.userId();

    }catch(e){ return null; }

    var v = (e && e.detail) || null;

  background:linear-gradient(135deg,var(--brand-light),var(--brand));cursor:pointer;box-shadow:0 4px 10px rgba(18,189,176,.3);}
/* 비활성 — 투명도 대신 토큰. --n-700 var(--n-700) / --n-200 var(--n-200) = 8.01:1 (opacity .6 은 2.65:1) · VN-44-5 */
#mnsy-ai:disabled{background:var(--n-200);color:var(--n-700);box-shadow:none;opacity:1;cursor:not-allowed;}
#mnsy-rx{padding-right:78px;}
#mnsy-hint{font-size:.875rem;color:var(--n-600);margin:6px 2px 0;line-height:1.5;min-height:15px;}
#mnsy-hint b{color:var(--brand);}
#mnsy-save{width:100%;margin-top:18px;font-family:inherit;font-weight:700;font-size:var(--fs-sub);color:#fff;border:none;border-radius:var(--r-md);padding:14px 0;cursor:pointer;
  background:linear-gradient(135deg,var(--brand-light),var(--brand));box-shadow:0 8px 20px rgba(18,189,176,.3);}
#mnsy-st{font-size:var(--fs-sub);font-weight:700;color:var(--brand);text-align:center;margin-top:10px;min-height:16px;}
#mnsy-list{margin-top:16px;}
#mnsy-list .it{background:var(--n-100);border:1px solid var(--brand-soft);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:8px;}
#mnsy-list .it .r1{display:flex;align-items:center;gap:8px;}
#mnsy-list .it .dt{font-size:.875rem;font-weight:700;color:var(--n-600);}
#mnsy-list .it .bg{font-size:.875rem;font-weight:700;padding:2px 8px;border-radius:var(--r-lg);}
#mnsy-list .it .sy{font-size:var(--fs-sub);font-weight:700;color:var(--n-900);margin-top:4px;}
#mnsy-list .it .mx{font-size:.875rem;color:var(--n-600);margin-top:2px;}
#mnsy-foot{font-size:.875rem;color:var(--n-600);text-align:center;margin-top:14px;line-height:1.55;border-top:1px solid var(--n-100);padding-top:12px;}
</style>
<script>
(function(){
  "use strict";
  var SB_URL=window.MEDINOTE_CONFIG.url;
  var SB_KEY=window.MEDINOTE_CONFIG.key;
  function REPORT_KEY(){ return window.MediNoteKV.reportKey(); }
  var RX_KEYS=["medinote:rx","medit:rx"];   // QR 약봉투(복약정보) 히스토리 저장 키 후보
  var SEV=[{k:"약함",bg:"#EAF7EC",c:"#3E8E4E"},{k:"보통",bg:"#FBF3E2",c:"#8A5A00"},{k:"심함",bg:"#FDEDE9",c:"#E4573E"}];

  function el(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];});}
  function todayStr(){var d=new Date();function p(n){return(n<10?"0":"")+n;}return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}

  var meds=[];       // 복약정보 히스토리에서 뽑은 약 이름들
  var records=[];    // 저장된 증상기록
  var sev="보통", built=false;

  function build(){
    if(built) return; built=true;
    var back=document.createElement("div"); back.id="mnsy-back";
    var sheet=document.createElement("div"); sheet.id="mnsy-sheet";
    sheet.innerHTML=
      '<div class="grip"></div>'+
      '<div class="hd"><span class="em">오늘 증상 기록</span>'+
        '<button class="cl" id="mnsy-x" aria-label="닫기">×</button></div>'+
      '<div class="sub">오늘 몸 상태를 짧게 남겨 두면, 다음 진료·상담 때 그대로 보여 드릴 수 있어요.</div>'+
      '<label for="mnsy-date">날짜</label><input id="mnsy-date" type="date">'+
      '<label id="mnsy-sev-lb">정도</label><div class="sev" id="mnsy-sev" role="group" aria-labelledby="mnsy-sev-lb"></div>'+
      '<label for="mnsy-sym">증상</label><input id="mnsy-sym" type="text" placeholder="예: 콧물, 두통, 기운 없음">'+
      '<label for="mnsy-rx">관련 약 <span style="font-weight:600;color:#577377">· 복약정보에서 자동으로 채워요</span></label>'+
      '<div id="mnsy-rxwrap"><input id="mnsy-rx" type="text" placeholder="복용 중인 약 (자동 채움)">'+
        '<button id="mnsy-ai" type="button">AI 채움</button></div>'+
      '<div id="mnsy-hint"></div>'+
      '<label for="mnsy-memo">메모 <span style="font-weight:600;color:#577377">· 선택</span></label>'+
      '<textarea id="mnsy-memo" placeholder="언제부터, 어떤 상황에서 그런지 등"></textarea>'+
      '<button id="mnsy-save">이 증상 기록하기</button>'+
      '<button id="mnsy-toreport" type="button" style="width:100%;margin-top:9px;font-family:inherit;font-weight:700;font-size:var(--fs-sub);color:var(--brand);background:#fff;border:1.5px solid var(--brand-soft);border-radius:var(--r-md);padding:12px 0;cursor:pointer;">기록으로 신고·공유하기</button>'+
      '<div id="mnsy-st"></div>'+
      '<div id="mnsy-list"></div>'+
      '<div id="mnsy-foot">MediNote · 정보 제공·상담 연결까지만, 판정·처방은 하지 않습니다<br>처방은 의사, 조제·상담은 약사와 상의해 주세요.</div>';
    document.body.appendChild(back); document.body.appendChild(sheet);

    // 심각도 칩
    var sv=el("mnsy-sev");
    SEV.forEach(function(o){ var b=document.createElement("button"); b.textContent=o.k; b.dataset.k=o.k;
      if(o.k===sev) b.className="sel";
      b.onclick=function(){ sev=o.k; Array.prototype.forEach.call(sv.children,function(c){c.className=(c.dataset.k===sev)?"sel":"";}); };
      sv.appendChild(b); });

    el("mnsy-date").value=todayStr();
    el("mnsy-x").onclick=close; back.onclick=close;
    el("mnsy-ai").onclick=aiFill;
    el("mnsy-save").onclick=save;
    el("mnsy-toreport").onclick=function(){ close(); if(window.MediNoteReport) window.MediNoteReport.open(); };
  }

  function open(){
    build();
    loadMeds();      // QR 복약정보 히스토리 → 관련약 자동채움
    loadRecords();
    el("mnsy-back").classList.add("on");
    requestAnimationFrame(function(){ el("mnsy-sheet").classList.add("on"); });
  }
  function close(){ el("mnsy-sheet").classList.remove("on"); el("mnsy-back").classList.remove("on"); }

  // ── QR 약봉투(복약정보) 히스토리 로드 → 약 이름 추출 ──
  function extractMeds(val){
    var out=[];
    function pushName(x){ if(!x) return; var n=(typeof x==="string")?x:(x.name||x.med||x.drug||x.title||x.제품명||x.약품명||""); n=String(n).trim(); if(n && out.indexOf(n)===-1) out.push(n); }
    try{
      if(Array.isArray(val)) val.forEach(function(row){
        if(row && Array.isArray(row.meds)) row.meds.forEach(pushName);
        else if(row && Array.isArray(row.items)) row.items.forEach(pushName);
        else pushName(row);
      });
      else if(val && Array.isArray(val.history)) val.history.forEach(function(h){ (h.meds||h.items||[]).forEach(pushName); if(!h.meds&&!h.items) pushName(h); });
      else if(val && Array.isArray(val.meds)) val.meds.forEach(pushName);
      else if(val && Array.isArray(val.rx)) val.rx.forEach(pushName);
    }catch(e){}
    return out;
  }
  function loadMeds(){
    meds=[];
    // 1) 로컬(localStorage)에서 먼저 (오프라인·즉시)
    try{ RX_KEYS.forEach(function(k){ var s=localStorage.getItem(k); if(s){ try{ meds=meds.concat(extractMeds(JSON.parse(s))); }catch(e){} } }); }catch(e){}
    fillRx();
    // 2) Supabase에서 히스토리 가져와 보강
    try{
      window.MediNoteKV.getMany(RX_KEYS)
        .then(function(map){ RX_KEYS.forEach(function(k){ var v=map&&map[k]; if(!v) return;
          extractMeds(v).forEach(function(m){ if(meds.indexOf(m)===-1) meds.push(m); }); }); fillRx(); })
        .catch(function(){});
    }catch(e){}
  }
  function fillRx(){
    var inp=el("mnsy-rx"); if(!inp) return;
    if(meds.length && !inp.value){ inp.value=meds.slice(0,4).join(", "); }
    var h=el("mnsy-hint");
    if(h) h.innerHTML = meds.length
      ? ('복약정보 히스토리에서 <b>'+meds.length+'개</b> 약을 찾았어요. [AI 채움]을 누르면 오늘 증상과 관련 있는 약만 골라 정리해 드려요. 이때 오늘 증상과 약 목록이 외부 AI 사업자(Anthropic · 미국)에 전달됩니다.')
      : '복약정보(QR 약봉투) 기록이 아직 없어요. 약 이름을 직접 적으셔도 됩니다. [AI 채움]을 누르면 오늘 증상이 외부 AI 사업자(Anthropic · 미국)에 전달됩니다.';
  }

  // ── AI 자동채움: 증상 + 복약 히스토리 → 관련약·메모 (카드 처리 없이 [[NOCARD]]) ──
  function aiFill(){
    var sym=(el("mnsy-sym").value||"").trim();
    if(!meds.length && !sym){ el("mnsy-hint").innerHTML='먼저 <b>증상</b>을 적어 주시면, 관련 있는 약을 더 잘 골라 드려요.'; return; }
    var btn=el("mnsy-ai"); btn.disabled=true; var old=btn.textContent; btn.textContent="채우는 중…";
    // 지시문은 서버(ai-helper 의 SYSTEM_FILL)에 있다. 여기 표시는 viaHelper 가 mode:"fill" 로 바꿔 보내는 신호일 뿐이다 (#44 MN-44-1).
    var sysP="[[NOCARD]]";
    // 복용약은 AI 도우미와 같이 20개까지만 보냅니다 (#111 MN-111-3)
    var sent=meds.slice(0,20);
    var usr="오늘 증상: "+(sym||"(미입력)")+"\n복용 중인 약(복약정보 히스토리): "+(sent.length?sent.join(", "):"(기록 없음)");
    var body={model:"claude-fable-5",max_tokens:400,system:sysP,messages:[{role:"user",content:usr}]};
    window.MediNoteAI.messages({method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){ return r.json(); })
      .then(function(d){
        var t=""; try{ t=(d.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n"); }catch(e){}
        var o=null; try{ o=JSON.parse(t.replace(/```json|```/g,"").trim()); }catch(e){}
        if(o && (o.med||o.note)){
          if(o.crisis) el("mnsy-rx").value="";   // 위기 안내일 때는 미리 채워진 관련약도 비운다(위기 증상 옆에 약이 저장되지 않게)
          else if(o.med) el("mnsy-rx").value=o.med;
          el("mnsy-hint").innerHTML= esc(o.note||"관련 약을 정리했어요. 최종 판단은 약사·의사와 상의해 주세요.");
        }else{
          // AI 실패 시 히스토리 원문으로 채움(끊김 없이)
          if(meds.length && !el("mnsy-rx").value) el("mnsy-rx").value=meds.join(", ");
          el("mnsy-hint").innerHTML='복약정보 기록으로 채웠어요. 관련 약만 남기고 다듬어 주세요.';
        }
      })
      .catch(function(){
        if(meds.length && !el("mnsy-rx").value) el("mnsy-rx").value=meds.join(", ");
        el("mnsy-hint").innerHTML='지금은 AI 연결이 어려워, 복약정보 기록으로 채웠어요.';
      })
      .then(function(){ btn.disabled=false; btn.textContent=old; });
  }

  // ── 저장 (로컬 우선 → Supabase 동기화) ──
  function currentRec(){
    return { date:el("mnsy-date").value||todayStr(), severity:sev,
      symptom:(el("mnsy-sym").value||"").trim(), meds:(el("mnsy-rx").value||"").trim(),
      memo:(el("mnsy-memo").value||"").trim(), ts:new Date().toISOString() };
  }
  function save(){
    var rec=currentRec();
    if(!rec.symptom){ el("mnsy-st").textContent="증상을 한 가지만 적어 주세요."; return; }
    records.unshift(rec);
    try{ localStorage.setItem(REPORT_KEY(), JSON.stringify(records)); }catch(e){}
    renderList();
    el("mnsy-st").textContent="기록했어요. 저장 중…";
    // 입력 초기화(정도·날짜는 유지)
    el("mnsy-sym").value=""; el("mnsy-memo").value="";
    try{
      window.MediNoteKV.put(REPORT_KEY(),{records:records})
        .then(function(ok){ el("mnsy-st").textContent=ok?"저장 완료 · 기기와 클라우드에 안전하게 담겼어요.":"기기에 저장했어요(클라우드는 다음에 동기화)."; })
        .catch(function(){ el("mnsy-st").textContent="기기에 저장했어요(오프라인)."; });
    }catch(e){ el("mnsy-st").textContent="기기에 저장했어요."; }
  }

  // 기기 사본과 서버 사본의 합집합 — 키: ts|date|symptom. 증상 기록은 지우는 단추가 없어 합쳐도 되살아나는 기록이 없다 (#172).
  function mergeRecords(a,b){
    var seen={}, out=[];
    (a||[]).concat(b||[]).forEach(function(r){
      if(!r||typeof r!=="object") return;
      var k=(r.ts||"")+"|"+(r.date||"")+"|"+(r.symptom||"");
      if(seen[k]) return; seen[k]=1; out.push(r);
    });
    out.sort(function(x,y){ var a1=String(x.ts||""), b1=String(y.ts||""); return a1<b1?1:(a1>b1?-1:0); });
    return out;
  }
  function loadRecords(){
    // 요청을 보낼 때의 키를 고정한다 — 응답을 기다리는 사이 계정이 바뀌면 그 응답은 버린다.
    // 안 그러면 이전 계정의 기록이 새 계정의 클라우드로 올라간다 (#173 Codex P1)
    var key=REPORT_KEY();
    records=[];
    try{ var s=localStorage.getItem(key); if(s){ var v=JSON.parse(s); records=Array.isArray(v)?v:(v.records||[]); } }catch(e){}
    renderList();
    try{
      window.MediNoteKV.get(key)
        .then(function(v){
          if(REPORT_KEY()!==key) return;
          var srv=(v&&Array.isArray(v.records))?v.records:[];
          // 서버 사본으로 기기 사본을 덮어쓰지 않는다 — 클라우드 저장이 실패한 기록(「다음에 동기화」)이 사라진다 (#172 MN-172-1)
          var merged=mergeRecords(records,srv);
          records=merged;
          try{ localStorage.setItem(key,JSON.stringify(records)); }catch(e){}
          renderList();
          // 여기서 서버로 다시 올리지 않는다 — 읽은 시점의 목록으로 덮어쓰면 그 사이 다른 기기가 저장한 기록을 지운다 (#173 Codex P2).
          // 기기에만 있는 기록은 기기에 남고 보이며, 다음 「기록하기」 때 합친 목록 전체가 올라간다.
        })
        .catch(function(){});
    }catch(e){}
  }
  function renderList(){
    var box=el("mnsy-list"); if(!box) return;
    if(!records.length){ box.innerHTML=""; return; }
    box.innerHTML='<div style="font-size:var(--fs-caption);font-weight:700;color:var(--brand);margin:6px 2px 8px">최근 기록 '+records.length+'건</div>'+
      records.slice(0,8).map(function(r){
        var o=SEV.filter(function(x){return x.k===r.severity;})[0]||SEV[1];
        return '<div class="it"><div class="r1"><span class="dt">'+esc(r.date)+'</span>'+
          '<span class="bg" style="background:'+o.bg+';color:'+o.c+'">'+esc(r.severity)+'</span></div>'+
          '<div class="sy">'+esc(r.symptom)+'</div>'+
          (r.meds?'<div class="mx">관련약 · '+esc(r.meds)+'</div>':'')+
          (r.memo?'<div class="mx">'+esc(r.memo)+'</div>':'')+'</div>';
      }).join("");
  }

  // ── "증상 기록" 텍스트 클릭 → 시트 오픈 (기존 UI 그대로, 오버레이만 추가) ──
  document.addEventListener("click",function(e){
    var t=e.target;
    // 시트/오버레이 내부 클릭(닫기·헤더 등)은 훅에서 제외 → 닫힘 방해 안 함
    if(t && t.closest && t.closest("#mnsy-sheet, #mnsy-back")) return;
    var hop=0;
    while(t && hop<4){
      if(t.id==="mnsy-sheet"||t.id==="mnsy-back") return;
      var tx=(t.textContent||"").trim();
      if(tx && tx.length<40 && /(증상\s*기록|오늘\s*증상)/.test(tx)){ e.preventDefault(); open(); return; }
      t=t.parentElement; hop++;
    }
  },true);

  window.MediNoteSymptom={ open:open, close:close, records:function(){return records;}, meds:function(){return meds;} };

  // 도우미가 "Nick님 정보에 맞춰" 답하려면 앱에 남은 기록을 함께 보내야 한다.
  // 프록시(ai-helper)가 이 값을 근거 블록으로 만들어 시스템 프롬프트에 붙인다.
  window.MediNoteHelperContext = function(){
    var out = {};
    try{
      var rs = (records || []).slice(0, 8).map(function(r){
        return [r.date, r.symptom, r.severity && ("정도 " + r.severity), r.memo].filter(Boolean).join(" · ");
      });
      if(rs.length) out.symptoms = rs;
      if(meds && meds.length) out.meds = meds.slice(0, 20);
    }catch(e){}
    // 프로필(이름·나이대·질환)은 첫 사용 때 확인받는 항목이고 서버 지시문(contextBlock)이 「나이대·성별 등 프로필」로 받습니다 — 계정만 보내던 것을 채웁니다 (PR #45 Codex)
    try{
      var pf = {};
      // 지금 계정이 저장한 프로필만 — 로그아웃 뒤 남은 앞사람 프로필은 보내지 않는다 (PR #71 Codex P1)
      try{ if(window.MediNoteProfile && window.MediNoteProfile.ownedByCurrent()) pf = JSON.parse(localStorage.getItem("medinote:profile")||"{}")||{}; }catch(e){}
      var prof = {};
      // 계정 식별자(uid)는 보내지 않습니다 — 도우미 답에 필요 없습니다. 서버(safeProfile)도 허용한 칸만 붙이지만, 배포 전이거나 옛 서버는 프로필 JSON 을 통째로 붙입니다 (#104 MN-104-1 · MN-104-3)
      if(pf.name) prof.name = String(pf.name).slice(0,40);
      if(pf.ageGroup) prof.ageGroup = pf.ageGroup;
      if(Array.isArray(pf.conditions) && pf.conditions.length) prof.conditions = pf.conditions.slice(0,20);
      if(Object.keys(prof).length) out.profile = prof;
    }catch(e){}
    return out;
  };
})();

<style>
#mnrp-back{position:fixed;inset:0;background:rgba(6,65,62,.34);z-index:100000;opacity:0;pointer-events:none;transition:opacity .22s;}
#mnrp-back.on{opacity:1;pointer-events:auto;}
#mnrp-wrap{position:fixed;left:0;right:0;bottom:0;z-index:100001;max-width:var(--measure-frame);margin:0 auto;height:94vh;background:var(--brand-soft);
  border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -18px 50px rgba(6,65,62,.24);transform:translateY(102%);transition:transform .28s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;overflow:hidden;}
#mnrp-wrap.on{transform:translateY(0);}
#mnrp-bar{display:flex;align-items:center;gap:9px;padding:12px 16px calc(12px);background:#fff;border-bottom:1px solid var(--brand-soft);flex-shrink:0;}
#mnrp-bar .gp{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:42px;height:5px;border-radius:var(--r-xs);background:var(--n-200);}
#mnrp-bar .tt{font-family:'Gaegu',cursive;font-weight:700;font-size:var(--fs-headline);color:var(--brand);}
#mnrp-bar .cl{margin-left:auto;border:none;background:var(--n-100);color:var(--n-600);width:44px;height:44px;border-radius:var(--r-sm);font-size:var(--fs-headline);cursor:pointer;flex-shrink:0;}
#mnrp-frame{flex:1;width:100%;border:none;background:var(--brand-soft);}
</style>
<script>
(function(){
  "use strict";
  var built=false;
  function build(){
    if(built) return; built=true;
    var back=document.createElement("div"); back.id="mnrp-back";
    var wrap=document.createElement("div"); wrap.id="mnrp-wrap";
    wrap.innerHTML=
      '<div id="mnrp-bar"><span class="gp"></span><span class="tt">증상 신고·공유</span>'+
        '<button class="cl" id="mnrp-x" aria-label="닫기">×</button></div>'+
      '<iframe id="mnrp-frame" title="증상 신고·공유" allow="geolocation; clipboard-write; clipboard-read"></iframe>';
    document.body.appendChild(back); document.body.appendChild(wrap);
    document.getElementById("mnrp-x").onclick=close; back.onclick=close;
  }
  function open(){
    build();
    var fr=document.getElementById("mnrp-frame");
    if(!fr.getAttribute("data-loaded")){ try{ fr.srcdoc=new TextDecoder().decode(Uint8Array.from(atob(window.__MNRP_SRC),function(c){return c.charCodeAt(0);})); fr.setAttribute("data-loaded","1"); }catch(e){ fr.setAttribute("src","증상신고_공유.html"); } }
    document.getElementById("mnrp-back").classList.add("on");
    requestAnimationFrame(function(){ document.getElementById("mnrp-wrap").classList.add("on"); });
  }
  function close(){
    var w=document.getElementById("mnrp-wrap"), b=document.getElementById("mnrp-back");
    if(w) w.classList.remove("on"); if(b) b.classList.remove("on");
  }

  // "이상반응 신고 / 증상 신고·공유 / 공유하기" 텍스트 클릭 → 오버레이 오픈
  document.addEventListener("click",function(e){
    var t=e.target;
    if(t && t.closest && t.closest("#mnrp-wrap, #mnrp-back, #mnsy-sheet, #mnsy-back")) return; // 내부/증상시트 제외
    var hop=0;
    while(t && hop<4){
      if(t.id==="mnrp-wrap"||t.id==="mnrp-back") return;
      var tx=(t.textContent||"").trim();
      if(tx && tx.length<40 && /(이상반응\s*신고|증상\s*신고|신고\s*·?\s*공유|증상\s*공유|공유하기)/.test(tx)){ e.preventDefault(); open(); return; }
      t=t.parentElement; hop++;
    }
  },true);

  window.MediNoteReport={ open:open, close:close };
})();
</script>

    new MutationObserver(later).observe(document.body,{childList:true,subtree:true});

    later(); });
})();

<div id="mnmd-pill" role="button" tabindex="0" aria-label="복약 알림"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 20.5l10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7z"/><path d="M8.5 8.5l7 7"/></svg>복약 알림</div>
<script>
(function(){
  "use strict";
  var KEY="medinote:meds:sched", LOG="medinote:meds:log";
  var PRESET=[["아침","08:00"],["점심","12:30"],["저녁","18:30"],["밤","21:00"]];
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null")||{on:false,quiet:{from:"21:30",to:"08:00"},items:[],sent:{},snooze:{}}; }catch(e){ return {on:false,quiet:{from:"21:30",to:"08:00"},items:[],sent:{},snooze:{}}; } }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(sc)); }catch(e){} pushNative(); renderNotify(); updateBadge(); emit(); }
  // 첫 화면 「오늘」 카드가 같은 일정·기록을 다시 그리도록 알립니다 (#69 MN-69-3·4)
  function emit(){ try{ window.dispatchEvent(new CustomEvent("medinote:meds")); }catch(e){} }
  // 폰 설정에서 알림이 꺼져 있는데 「알림 켜기」가 켜져 있으면 알려 줍니다 — 열려 있는 복약 창에서도 켜고 끌 때·설정에서 돌아올 때 다시 그립니다 (#94 · PR #95 Codex P1 · Sourcery)
  function renderNotify(){
    var box=document.getElementById("mnmdNotifBox"); if(!box) return;
    var bad=NATIVE && sc && sc.on && typeof window.Native.notifyAllowed==="function" && !window.Native.notifyAllowed();
    var html=bad ? '<div class="mnhw-note">폰 설정에서 메디노트 알림이 꺼져 있어 알림이 오지 않아요. 켜 주세요. <button type="button" class="mnhw-btn" id="mnmdNotif" style="margin-top:6px">알림 설정 열기</button></div>' : '';
    if(box.getAttribute("data-h")!==html){ box.setAttribute("data-h",html); box.innerHTML=html; }   /* 같은 내용으로 다시 그리면 낭독기가 같은 경고를 되풀이해 읽으므로 바뀔 때만 (aria-live · #174 후보) */
    var nf=document.getElementById("mnmdNotif"); if(nf) nf.onclick=function(){ try{ window.Native.openNotifySettings(); }catch(e){} };
  }
  window.__mnNotifyChanged=renderNotify;   // iOS: 설정을 읽는 일은 비동기라 값이 오면 MedNotifier 가 부릅니다
  // 앱 셸(안드로이드·iOS)이 있으면 일정을 폰에 넘깁니다 — 앱을 닫아도 폰이 정한 시각에 울립니다 (#16 MN-16-6)
  var NATIVE=!!(window.Native && typeof window.Native.scheduleMeds==="function");
  function pushNative(){ if(!NATIVE) return; try{ window.Native.scheduleMeds(JSON.stringify({on:!!sc.on,quiet:sc.quiet,items:sc.items})); }catch(e){} }
  function pullNative(){ if(!NATIVE || typeof window.Native.medsLogTake!=="function") return; try{ var nl=JSON.parse(window.Native.medsLogTake()||"[]"); if(nl&&nl.length){ nl.forEach(function(e){ addLog({action:e.action,id:e.id,name:e.name,time:e.time,at:e.at||Date.now()}); }); } }catch(e){} }
  function log(){ try{ return JSON.parse(localStorage.getItem(LOG)||"[]"); }catch(e){ return []; } }
  function addLog(e){ var l=log(); l.unshift(e); try{ localStorage.setItem(LOG,JSON.stringify(l.slice(0,500))); }catch(x){} emit(); }
  var sc=load(); sc.items=sc.items||[]; sc.sent=sc.sent||{}; sc.snooze=sc.snooze||{}; sc.quiet=sc.quiet||{from:"21:30",to:"08:00"};
  pullNative();
  pushNative();   // 앱이 뜰 때 한 번 — 업데이트한 앱이 예전 약별 알림(본문에 약 이름)을 일정을 고칠 때까지 안고 있지 않게, 바로 시각별 묶음으로 다시 겁니다 (PR #167 Codex)
  document.addEventListener("visibilitychange",function(){ if(!document.hidden){ pullNative(); renderNotify(); updateBadge(); } });
  window.onNativeMeds=function(r){ if(r&&r.granted===false){ sc.on=false; save(); /* 폰에 저장된 일정도 꺼야 안드로이드 알람이 남지 않습니다 (#47 MN-47-1) */ var c=document.getElementById("mnmdOn"); if(c) c.checked=false; stt("알림 권한이 없어 켤 수 없어요. 폰 설정에서 메디노트 알림을 허용해 주세요."); }
    if(r&&r.limit) stt("알림 시각이 너무 많아 일부 시각은 알림이 오지 않아요. 시각 수를 줄여 주세요.");   /* iPhone 은 걸어 둘 수 있는 알림이 64개까지입니다 (#36 MN-36-4) */ };
  function hm(t){ var a=String(t||"0:0").split(":"); return (+a[0])*60+(+a[1]); }
  function quiet(m){ var a=hm(sc.quiet.from), b=hm(sc.quiet.to); return a<=b ? (m>=a&&m<b) : (m>=a||m<b); }
  function esc(x){ return String(x).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function dayKey(){ return new Date().toDateString(); }

  var pill=document.getElementById("mnmd-pill");
  function showPill(){ pill.classList.add("on"); }
  setTimeout(showPill, 2500);
  // 글자를 키우면 아래 탭 줄이 높아져 떠 있는 알약이 탭을 덮는다 (360×640 · 200%: 5칸 중 3칸). 탭 줄이 화면 아래에서 차지하는 높이를 재서 알약이 그 위로 오게 한다.
  // 100% 에서는 기존 84px 이 더 커서 위치가 그대로다.
  var navRaf=0, navEl=null, navRO=null;
  function fitNav(){
    navRaf=0;
    var n=document.querySelector(".mn-nav"); if(!n) return;
    if(n!==navEl){ navEl=n; try{ if(navRO) navRO.disconnect(); navRO=new ResizeObserver(queueFit); navRO.observe(n); }catch(e){} }   // 글자 크기가 앱을 연 뒤에 바뀌어도 탭 줄 높이를 다시 잰다
    var h=Math.max(0, Math.round(window.innerHeight-n.getBoundingClientRect().top));
    var root=document.documentElement.style;
    if(root.getPropertyValue("--mn-nav-h")!==h+"px") root.setProperty("--mn-nav-h", h+"px");
  }
  function queueFit(){ if(!navRaf) navRaf=requestAnimationFrame(fitNav); }
  window.addEventListener("resize", queueFit);
  try{ new MutationObserver(queueFit).observe(document.body,{childList:true,subtree:true}); }catch(e){}
  queueFit();
  pill.onclick=open; pill.onkeydown=function(e){ if(e.key==="Enter"||e.key===" ") open(); };

  function ensure(){
    var ov=document.getElementById("mnmdOv"); if(ov) return ov;
    ov=document.createElement("div"); ov.className="mnhw-ov"; ov.id="mnmdOv"; ov.innerHTML='<div class="mnhw-sheet" id="mnmdSheet"></div>';
    document.body.appendChild(ov); ov.addEventListener("click",function(e){ if(e.target===ov) ov.classList.remove("on"); }); return ov;
  }
  var pickTimes=[];
  function open(){
    var ov=ensure(), s=document.getElementById("mnmdSheet"); pickTimes=[];
    var taken7=log().filter(function(e){ return e.action==="taken"&&Date.now()-e.at<7*86400000; }).length;
    s.innerHTML='<div class="mnhw-h"><b>복약 알림</b><span class="x" id="mnmdX">×</span></div>'+
      '<div class="mnhw-sub">정한 시각에 알려 드리고, 알림의 「복용했어요」를 누르면 기록에 남아요. '+(NATIVE?'앱을 닫아도 폰이 정한 시각에 울립니다.':'앱을 열어 둔 동안 울립니다(닫혀 있을 때는 서버 푸시가 필요 · #16).')+' 조용한 시간에는 오지 않아요.</div>'+
      (NATIVE && typeof window.Native.exactAlarmAllowed==="function" && !window.Native.exactAlarmAllowed() ? '<div class="mnhw-note">정확한 시각에 울리려면 폰 설정에서 「알람 및 리마인더」를 허용해 주세요. <button type="button" class="mnhw-btn" id="mnmdExact" style="margin-top:6px">설정 열기</button></div>' : '')+
      '<div id="mnmdNotifBox"></div>'+
      '<label class="mnmd-chk"><input type="checkbox" id="mnmdOn"'+(sc.on?" checked":"")+'> 복약 알림 켜기</label>'+
      '<div id="mnmdList"></div>'+
      '<div class="mnmd-fld"><label for="mnmdName">약 이름</label><input id="mnmdName" type="text" placeholder="예: 혈압약"></div>'+
      '<div class="mnmd-fld"><label id="mnmdChips-lb">시각 (여러 개 가능)</label><div class="mnmd-chips" id="mnmdChips" role="group" aria-labelledby="mnmdChips-lb">'+PRESET.map(function(p){ return '<button type="button" data-t="'+p[1]+'">'+p[0]+' '+p[1]+'</button>'; }).join("")+'</div></div>'+
      '<div class="mnmd-fld"><label for="mnmdCustom">직접 시각</label><input type="time" id="mnmdCustom"></div>'+
      '<button class="mnhw-btn" id="mnmdAdd">이 약 알림 추가</button>'+
      '<div class="mnmd-two" style="margin-top:12px"><div class="mnmd-fld"><label for="mnmdQ1">조용한 시간 시작</label><input type="time" id="mnmdQ1" value="'+esc(sc.quiet.from)+'"></div><div class="mnmd-fld"><label for="mnmdQ2">끝</label><input type="time" id="mnmdQ2" value="'+esc(sc.quiet.to)+'"></div></div>'+
      '<div class="mnhw-note">지난 7일 「복용했어요」 '+taken7+'건. 기록은 이 기기에 저장돼요.'+(NATIVE?' 폰을 바꾸면 알림 일정과 기록은 옮겨지지 않아요.':' 폰을 바꾸면 따라오지 않아요.')+'</div><div class="mnhw-st" id="mnmdSt"></div>';
    document.getElementById("mnmdX").onclick=function(){ ov.classList.remove("on"); };
    var ex=document.getElementById("mnmdExact"); if(ex) ex.onclick=function(){ try{ window.Native.openExactAlarmSettings(); }catch(e){} };
    renderNotify();
    document.getElementById("mnmdOn").onchange=function(){
      var c=this; if(c.checked && "Notification" in window && Notification.permission!=="granted"){ Notification.requestPermission().then(function(p){ if(p!=="granted"){ c.checked=false; sc.on=false; save(); stt("알림 권한이 없어 켤 수 없어요."); } }); }
      sc.on=c.checked; save(); stt(sc.on?"알림을 켰어요":"알림을 껐어요");
    };
    document.querySelectorAll("#mnmdChips button").forEach(function(b){ b.onclick=function(){ var t=b.dataset.t, i=pickTimes.indexOf(t); if(i<0) pickTimes.push(t); else pickTimes.splice(i,1); b.classList.toggle("on",i<0); }; });
    document.getElementById("mnmdAdd").onclick=function(){
      var name=document.getElementById("mnmdName").value.trim(), custom=document.getElementById("mnmdCustom").value; var times=pickTimes.slice(); if(/^\d\d:\d\d$/.test(custom)) times.push(custom);
      if(!name) return stt("약 이름을 적어 주세요"); if(!times.length) return stt("시각을 하나는 골라 주세요");
      sc.items.push({id:"m"+Date.now().toString(36),name:name,times:times.sort()}); sc.on=true; save(); renderList(); document.getElementById("mnmdOn").checked=true; document.getElementById("mnmdName").value=""; stt("추가했어요");
      if("Notification" in window && Notification.permission==="default") Notification.requestPermission();
    };
    ["mnmdQ1","mnmdQ2"].forEach(function(id){ document.getElementById(id).onchange=function(){ var v=this.value; if(/^\d\d:\d\d$/.test(v)){ if(id==="mnmdQ1") sc.quiet.from=v; else sc.quiet.to=v; save(); stt("조용한 시간을 저장했어요"); } }; });
    renderList(); ov.classList.add("on");
  }
  function stt(m){ var e=document.getElementById("mnmdSt"); if(e) e.textContent=m; }
  // 「×」 로 지운 줄은 몇 초 동안 「되돌리기」로 되살릴 수 있습니다 — 같은 자리·같은 id 로 돌아가고 폰 알람도 다시 넘깁니다 (#160 MN-160-2 · 대표님 결정 2026-11-03 가)
  var undoDel=null, undoTimer=0, UNDO_MS=8000;
  function clearUndo(){ undoDel=null; if(undoTimer){ clearTimeout(undoTimer); undoTimer=0; } }
  function renderList(){
    var el=document.getElementById("mnmdList"); if(!el) return;
    // 빈 상태에 다음 걸음을 적습니다 (#159 MN-159-1 · 대표님 결정 2026-11-03)
    el.innerHTML = (sc.items.length ? sc.items.map(function(it){ return '<div class="mnmd-row"><div class="t">'+esc(it.name)+'<small>'+it.times.join(" · ")+'</small></div><button type="button" class="x" data-id="'+it.id+'" aria-label="'+esc(it.name)+' 지우기">×</button></div>'; }).join("") : '<div class="mnhw-note">아직 등록한 약이 없어요. 위에 약 이름을 적고 시각을 골라 「추가」를 눌러 주세요.</div>')+
      (undoDel ? '<div class="mnhw-note" role="status">「'+esc(undoDel.it.name)+'」 알림을 지웠어요.<div class="mnmd-chips" style="margin-top:6px"><button type="button" id="mnmdUndo">되돌리기</button></div></div>' : '');
    var ub=document.getElementById("mnmdUndo");
    if(ub) ub.onclick=function(){ if(!undoDel) return; var d=undoDel; clearUndo(); sc.items.splice(Math.min(d.at,sc.items.length),0,d.it); save(); renderList(); stt("되돌렸어요"); var bx=el.querySelector('.x[data-id="'+d.it.id+'"]'); if(bx) bx.focus(); };
    el.querySelectorAll(".x").forEach(function(x){ x.onclick=function(){ var at=sc.items.findIndex(function(i){ return i.id===x.dataset.id; }); if(at>=0){ clearUndo(); undoDel={it:sc.items[at],at:at}; undoTimer=setTimeout(function(){ var onU=document.activeElement&&document.activeElement.id==="mnmdUndo"; undoTimer=0; undoDel=null; renderList(); if(onU){ var nm=document.getElementById("mnmdName"); if(nm) nm.focus(); } }, UNDO_MS); } sc.items=sc.items.filter(function(i){ return i.id!==x.dataset.id; }); save(); renderList(); var xs=el.querySelectorAll(".x"), nx=xs[Math.min(Math.max(at,0),xs.length-1)]; if(nx) nx.focus(); else { var u=document.getElementById("mnmdUndo"); if(u) u.focus(); else { var nm=document.getElementById("mnmdName"); if(nm) nm.focus(); } } }; });
  }

  // 울리기 — 앱이 열려 있는 동안 30초마다 봄. 같은 약·같은 시각은 하루 한 번.
  // 같은 시각의 약은 알림 한 통으로 묶고, 본문에 약 이름을 쓰지 않습니다 — 잠금화면에 약 이름이 보이지 않게 (#83 MN-83-4 · #123 MN-123-1 · #36 MN-36-4)
  function notify(list,time){
    var body="약 "+list.length+"가지 드실 시간이에요 ("+time+")";
    var data={time:time,items:list.map(function(it){ return {id:it.id,name:it.name}; })};
    try{
      if(navigator.serviceWorker && navigator.serviceWorker.controller){
        navigator.serviceWorker.ready.then(function(reg){ reg.showNotification("메디노트 복약 알림",{body:body,icon:"icon-192.png",badge:"favicon-32.png",lang:"ko",tag:"mnmd-"+time,data:data,requireInteraction:true,actions:[{action:"taken",title:"복용했어요"},{action:"later",title:"10분 뒤"}]}); });
      } else if("Notification" in window && Notification.permission==="granted"){
        // 본문을 누르면 앱만 엽니다 — 「복용했어요」는 단추로만 기록합니다 (#97 MN-97-3)
        var n=new Notification("메디노트 복약 알림",{body:body,icon:"icon-192.png",tag:"mnmd-"+time}); n.onclick=function(){ try{ window.focus(); }catch(e){} n.close(); };
      }
    }catch(e){}
  }
  function record(action,data){
    if(action!=="taken" && action!=="later" && action!=="skipped") return;   // skipped: 첫 화면 카드의 「아직」 — 기록만 (#69 MN-69-4)
    var list=data.items || (data.id ? [{id:data.id,name:data.name}] : []);   // data.id: 묶기 전에 뜬 알림
    list.forEach(function(it){
      addLog({action:action,id:it.id,name:it.name,time:data.time,at:Date.now()});
      if(action==="later") sc.snooze[it.id+"|"+data.time]=Date.now()+10*60000;
    });
    if(action==="later") save();
    if(action==="taken") buzz();
    updateBadge();
  }
  // 「복용했어요」를 눌렀을 때 짧게 한 번 진동 (Vibration API · 실험 · #186 MN-186-1)
  // medinote.config.js 의 haptic 이 true 일 때만. 기본은 꺼짐 — 화면·소리·저장은 그대로입니다. 바깥 주소 없음, 보내는 값 없음.
  // 앱 셸(WebView)에는 진동 권한 선언이 없어 건너뜁니다. iOS Safari 는 이 API 가 없어 아무 일도 없습니다. 눌렀을 때(사용자 동작) 한 번만 부릅니다.
  function buzz(){
    try{
      if(NATIVE || (window.MEDINOTE_CONFIG||{}).haptic!==true || typeof navigator.vibrate!=="function") return;
      var ua=navigator.userActivation; if(ua && !ua.isActive) return;   // 알림 창 단추·앱 열림 주소로 들어온 기록은 지금 눌린 것이 아니라 건너뜁니다
      navigator.vibrate(40);
    }catch(e){}
  }

#mnlg-sheet{position:fixed;left:0;right:0;bottom:0;z-index:100071;max-width:460px;margin:0 auto;background:#fff;border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92vh;overflow-y:auto;/* 200% 글자·작은 폰에서 닫기 단추가 화면 위로 나가지 않게 (#61 MN-61-1) */
  box-shadow:0 -18px 50px rgba(6,65,62,.22);padding:8px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(102%);
  transition:transform .26s cubic-bezier(.22,1,.36,1);font-family:'Pretendard',-apple-system,sans-serif;letter-spacing:-.01em;}
#mnlg-sheet.on{transform:translateY(0);}
#mnlg-sheet .gp{width:42px;height:5px;border-radius:var(--r-xs);background:var(--n-200);margin:8px auto 14px;}

#mnlg-x{position:absolute;top:10px;right:12px;width:44px;height:44px;border:none;background:var(--n-100);border-radius:50%;font-size:var(--fs-title2);line-height:1;color:var(--n-600);cursor:pointer;display:grid;place-items:center;}

#mnlg-cur{background:var(--n-100);border:1px solid var(--brand-soft);border-radius:var(--r-sm);padding:11px 13px;font-size:var(--fs-sub);color:var(--brand);font-weight:700;margin-bottom:14px;display:none;}

.mnlg-g{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;font-family:inherit;font-weight:700;font-size:var(--fs-body);color:#3c4043;

.mnlg-g svg{width:19px;height:19px;}

    document.body.appendChild(back); document.body.appendChild(sheet);
    back.onclick=close;
    el("mnlg-tab-login").onclick=function(){ setMode("login"); };
    el("mnlg-tab-signup").onclick=function(){ setMode("signup"); };
    el("mnlg-submit").onclick=submitAuth;
    el("mnlg-pw").addEventListener("keydown",function(e){ if(e.key==="Enter") submitAuth(); });
    el("mnlg-code").addEventListener("keydown",function(e){ if(e.key==="Enter") submitAuth(); });
    el("mnlg-email").addEventListener("input",function(){ if(otpSent){ otpSent=false; setMode(authMode); } });
    // 코드로 가입한 계정은 비밀번호가 없습니다 — 로그인 탭에서도 메일 코드로 들어올 수 있게 (PR #168 Codex)
    el("mnlg-codetoggle").onclick=function(){ loginByCode=!loginByCode; otpSent=false; setMode("login"); };
    // 코드가 지났거나 안 왔을 때 새 코드 (PR #168 Codex)
    el("mnlg-resend").onclick=function(){ otpSent=false; el("mnlg-code").value=""; submitAuth(); };
    ["mnlg-email","mnlg-pw"].forEach(function(id){ el(id).addEventListener("input",function(){ invalid(id,false); }); });
    el("mnlg-google").onclick=googleLogin;
    el("mnlg-quicktoggle").onclick=function(){ var q=el("mnlg-quick"); q.style.display=(q.style.display==="none")?"block":"none"; };
    el("mnlg-start").onclick=function(){ var v=(el("mnlg-id").value||"").trim().replace(/\s+/g,"");
      var cfg=window.MEDINOTE_CONFIG||{};
      if(cfg.anonAuth===true&&sb&&sb.auth&&sb.auth.signInAnonymously){
        /* MN-55-1 — medinote.config.js 의 anonAuth 가 true 일 때만: 기기 번호 대신 익명 계정(진짜 uid)으로.
           나중에 Google·이메일을 붙이면 같은 계정이 된다. 실패하면 지금까지의 아이디 길 그대로. */
        sb.auth.signInAnonymously().then(function(r){ if(r&&r.error) throw r.error; close(); })
          .catch(function(){ if(!v){ el("mnlg-id").focus(); return; } setUid(v,"id"); close(); });
        return;
      }
      if(!v){ el("mnlg-id").focus(); return; } setUid(v,"id"); close(); };
    el("mnlg-out").onclick=function(){ askWipe("logout"); };
    el("mnlg-wipelink").onclick=function(){ askWipe("wipe"); };
    el("mnlg-x").onclick=close;
  }
  function open(){ build(); otpSent=false; setMode(authMode); paint(); document.getElementById("mnlg-back").classList.add("on"); requestAnimationFrame(function(){ document.getElementById("mnlg-sheet").classList.add("on"); }); }
  function close(){ var s=document.getElementById("mnlg-sheet"),b=document.getElementById("mnlg-back"); if(s)s.classList.remove("on"); if(b)b.classList.remove("on"); }

  function paint(){
    if(!built) return;
    var u=uid(), loggedin=(u!=="guest");
    var name = user ? ((user.user_metadata&&(user.user_metadata.name||user.user_metadata.full_name))||user.email||u) : u;
    el("mnlg-nm").textContent = loggedin ? name : "로그인";
    el("mnlg-av").textContent = loggedin ? String(name).slice(0,1).toUpperCase() : "?";
    var cur=el("mnlg-cur"), forms=el("mnlg-forms"), out=el("mnlg-out");
    if(loggedin){ cur.classList.add("on"); cur.innerHTML="현재 로그인 · <b>"+esc(name)+"</b>"; if(forms) forms.style.display="none"; if(out) out.classList.add("on");
      if(el("mnlg-hd")) el("mnlg-hd").textContent="내 계정"; if(el("mnlg-sub")) el("mnlg-sub").textContent="로그인 상태입니다. 기록이 이 계정에 저장됩니다."; }
    else { cur.classList.remove("on"); if(forms) forms.style.display="block"; if(out) out.classList.remove("on"); }
  }

  function status(msg,isErr){ var s=el("mnlg-status"); if(!s) return; if(!msg){ s.className=""; s.textContent=""; return; } s.className=isErr?"err":"ok"; s.textContent=msg; }
  // 메일 코드 길인가 — 회원가입은 늘, 로그인 탭은 「메일로 코드 받기」를 골랐을 때
  function codePath(){ return authMode==="signup"||loginByCode; }
  function setMode(m,keep){ if(m!==authMode){ otpSent=false; loginByCode=false; } authMode=m;
    if(el("mnlg-tab-login")) el("mnlg-tab-login").classList.toggle("on",m==="login");
    if(el("mnlg-tab-signup")) el("mnlg-tab-signup").classList.toggle("on",m==="signup");
    if(el("mnlg-name")) el("mnlg-name").style.display=(m==="signup")?"block":"none";
    /* 회원가입은 비밀번호 대신 메일로 받은 코드(signInWithOtp · #55 MN-55-6). 로그인 탭의 비밀번호 길은 기존 이메일 사용자를 위해 그대로 두고,
       코드로 가입한 사람(비밀번호 없음)은 로그인 탭의 「메일로 코드 받기」로 들어온다 */
    var cp=codePath();
    if(el("mnlg-pw")) el("mnlg-pw").style.display=cp?"none":"";
    if(el("mnlg-code")) el("mnlg-code").style.display=(cp&&otpSent)?"":"none";
    if(el("mnlg-resend")) el("mnlg-resend").style.display=(cp&&otpSent)?"":"none";
    if(el("mnlg-codetoggle")){ el("mnlg-codetoggle").style.display=(m==="login")?"":"none"; el("mnlg-codetoggle").textContent=loginByCode?"비밀번호로 로그인":"메일로 코드 받기"; }
    if(el("mnlg-submit")) el("mnlg-submit").textContent=cp?(otpSent?"코드 확인":"코드 받기"):"로그인";
    if(el("mnlg-hd")) el("mnlg-hd").textContent=(m==="signup")?"회원가입":"로그인";
    if(!keep){ status(""); invalid("mnlg-email",false); invalid("mnlg-pw",false); invalid("mnlg-code",false); }
  }
  function mapErr(m){ m=String(m||"");
    if(/already registered|already exists|User already/i.test(m)) return "이미 가입된 이메일입니다. 로그인해 주세요.";
    if(/Invalid login|invalid credentials|Invalid email or password/i.test(m)) return "이메일 또는 비밀번호가 올바르지 않습니다.";
    if(/Email not confirmed/i.test(m)) return "이메일 인증이 필요합니다. 메일의 인증 링크를 눌러 주세요.";
    if(/at least/i.test(m)) return "비밀번호는 6자 이상이어야 합니다.";
    if(/expired|invalid.*(otp|token)|(otp|token).*invalid/i.test(m)) return "코드가 맞지 않거나 시간이 지났습니다. 코드를 다시 받아 주세요.";
    if(/security purposes|rate limit|too many/i.test(m)) return "잠시 후 다시 시도해 주세요.";
    if(/signups? not allowed|user not found/i.test(m)) return "가입되지 않은 이메일입니다. 회원가입 탭에서 가입해 주세요.";
    if(/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return "서버에 연결하지 못했습니다. 네트워크 연결을 확인한 뒤 다시 시도해 주세요.";   // 영어 원문(Failed to fetch)이 그대로 보이던 것 (#69)
    return "로그인에 실패했습니다. 잠시 후 다시 시도해 주세요. ("+m+")"; }
  // 이미 잡고 있던 입력 오류를 칸에도 표시합니다 (테두리 --danger + aria-invalid · VN-44-5). 검사 규칙은 그대로.
  function invalid(id,on){ var i=el(id); if(!i) return;
    if(on){ i.setAttribute("aria-invalid","true"); i.setAttribute("aria-describedby","mnlg-status"); }
    else { i.removeAttribute("aria-invalid"); i.removeAttribute("aria-describedby"); } }
  function submitAuth(){
    if(!sb){ status("로그인 모듈 로딩 중입니다. 잠시 후 다시 시도하세요.", true); return; }
    var email=(el("mnlg-email").value||"").trim(), pw=(el("mnlg-pw").value||"");
    invalid("mnlg-email",false); invalid("mnlg-pw",false);
    if(email.indexOf("@")<1){ status("이메일을 정확히 입력하세요.", true); invalid("mnlg-email",true); el("mnlg-email").focus(); return; }
    if(codePath()){ submitOtp(email); return; }
    if(pw.length<6){ status("비밀번호는 6자 이상이어야 합니다.", true); invalid("mnlg-pw",true); el("mnlg-pw").focus(); return; }
    var btn=el("mnlg-submit"); btn.disabled=true; var old=btn.textContent; btn.textContent="처리 중…";
    var done=function(){ btn.disabled=false; btn.textContent=old; };
    sb.auth.signInWithPassword({email:email,password:pw})
      .then(function(r){ if(r.error){ status(mapErr(r.error.message),true); } else { status("로그인되었습니다.",false); setTimeout(close,500); } })
      .catch(function(){ status("로그인 중 오류가 발생했습니다.",true); }).then(done);
  }
  // 메일 코드 — 1) 코드 받기 2) 코드 넣기. 메일의 링크를 누르지 않아도 됩니다 (#55 MN-55-6)
  // 회원가입이면 계정을 만들고, 로그인 탭이면 있는 계정에만 보냅니다(shouldCreateUser:false)
  function submitOtp(email){
    var signup=(authMode==="signup"), fail=signup?"가입 중 오류가 발생했습니다.":"로그인 중 오류가 발생했습니다.";
    var btn=el("mnlg-submit"); btn.disabled=true; var old=btn.textContent; btn.textContent="처리 중…";
    var done=function(){ btn.disabled=false; btn.textContent=old; setMode(authMode,true); };
    if(!otpSent){
      var opts={shouldCreateUser:signup,emailRedirectTo:location.href.split("#")[0]};
      if(signup) opts.data={name:(el("mnlg-name").value||"").trim()};
      sb.auth.signInWithOtp({email:email,options:opts})
        .then(function(r){ if(r.error){ status(mapErr(r.error.message),true); }
          else { otpSent=true; status("메일로 보낸 코드를 넣어 주세요.",false); setTimeout(function(){ var c=el("mnlg-code"); if(c) c.focus(); },0); } })
        .catch(function(){ status(fail,true); }).then(done);
      return;
    }
    var code=(el("mnlg-code").value||"").replace(/\s+/g,"");
    if(!/^[0-9]{6,10}$/.test(code)){ btn.disabled=false; btn.textContent=old; status("메일로 받은 숫자 코드를 넣어 주세요.",true); invalid("mnlg-code",true); el("mnlg-code").focus(); return; }
    invalid("mnlg-code",false);
    sb.auth.verifyOtp({email:email,token:code,type:"email"})
      // 틀렸거나 시간이 지난 코드는 다시 못 씁니다 — 「코드 받기」로 돌려 새 코드를 받게 합니다
      .then(function(r){ if(r.error){ otpSent=false; el("mnlg-code").value=""; status(mapErr(r.error.message),true); }
        else { otpSent=false; el("mnlg-code").value=""; status(signup?"가입 완료! 로그인되었습니다.":"로그인되었습니다.",false); setTimeout(close,800); } })
      .catch(function(){ status(fail,true); }).then(done);
  }

  function gerr(msg){ var e=document.getElementById("mnlg-gerr"); if(e){ e.classList.add("on"); e.innerHTML=msg; } }
  function googleLogin(){
    var e=document.getElementById("mnlg-gerr"); if(e) e.classList.remove("on");
    // 앱 셸은 file:// 이거나(iOS) https://appassets.androidplatform.net(안드로이드 · WebViewAssetLoader)라 protocol 만으로는 못 가립니다 —
    // 안드로이드에서는 OAuth 가 Chrome 으로 튕겨 나가 돌아오지 못합니다 (#78 MN-78-1). window.Native 가 있으면 셸입니다
    if(location.protocol==="file:"||(window.Native&&typeof window.Native.platform==="function")){ gerr("이 앱에서는 Google 로그인이 안 됩니다. 웹 주소 <a href=\"https://hyunjeongshin83.github.io/MediNote/\" target=\"_blank\" rel=\"noopener\">hyunjeongshin83.github.io/MediNote</a> 에서 해 주세요."); return; }
    // 카카오톡·네이버·인스타그램 등 앱 안 브라우저(웹뷰, 안드로이드 기본 웹뷰의 "; wv)" 포함)에서는 구글이 로그인을 403 disallowed_useragent 로 막습니다 — 누르기 전에 알립니다 (#81 MN-81-2)
    if(/KAKAOTALK|NAVER\(|FBAN|FBAV|FB_IAB|Instagram|DaumApps|Line\/|; wv\)/i.test(navigator.userAgent||"")){ gerr("카카오톡·네이버 같은 앱 안의 브라우저에서는 Google 로그인이 막혀 있어요. 메뉴에서 <b>다른 브라우저로 열기</b>를 누르거나, 웹 주소 <a href=\"https://hyunjeongshin83.github.io/MediNote/\" target=\"_blank\" rel=\"noopener\">hyunjeongshin83.github.io/MediNote</a> 를 Chrome·Safari 에서 열어 주세요."); return; }
    if(location.protocol!=="https:" && location.hostname!=="localhost"){ gerr("Google 로그인은 <b>https</b> 주소에서만 됩니다."); return; }
    if(!sb){ gerr("로그인 모듈을 불러오는 중입니다. 잠시 후 다시 눌러 주세요."); return; }
    try{
      sb.auth.signInWithOAuth({provider:"google",options:{
        redirectTo:location.href.split("#")[0],
        // 생년월일 민감 스코프(user.birthday.read)는 요청하지 않는다 — 구글 동의 화면이 403 으로 막혔다 (#81 MN-81-1).
        // 생년월일은 프로필 화면에서 직접 여쭙는다.
        // prompt:"consent" 와 access_type:"offline" 은 뺐다 — 동의 화면을 매번 띄우고, 앱이 쓰지 않는 refresh token 을
        // 세션에 담아 기기에 남겼다 (#55 MN-55-5 · #83 MN-83-5). 기본값이면 두 번째 로그인부터 동의 화면 없이 들어온다.
      }})
        .then(function(r){ if(r&&r.error){ gerr("Google 공급자 설정이 필요합니다 (관리자 1회): <b>"+esc(r.error.message||"provider not enabled")+"</b><br>Supabase → Authentication → Providers → <b>Google 켜기</b> + Redirect URL 등록이 필요합니다."); } })
        .catch(function(){ gerr("로그인을 시작할 수 없습니다. 잠시 후 다시 시도하거나 본인 아이디로 로그인하세요."); });
    }catch(err){ gerr("로그인을 시작할 수 없습니다. 본인 아이디로 로그인해 주세요."); }
  }
  function logout(after){ var fin=function(){ user=null; setUid("guest"); if(after) after(); else close(); };
    if(sb&&user){ sb.auth.signOut().then(fin,fin); } else fin(); }

  /* 이 기기에 남은 내 기록 지우기 (#51 MN-51-5) — 로그아웃은 계정만 바꾸고 기기 사본(복약 일정·복용 기록·증상 기록 사본·
     비로그인 측정값·g_ 기기 토큰·프로필·처방)을 남겨, 같은 기기의 다음 사람이 보게 되던 것. 서버(계정)에 저장한 것은 지우지 않습니다. */
  var WIPE_KEEP={"medinote:installhide":1};
  function wipeDevice(){
    var N=window.Native;
    // 앱 셸: 폰에 넘긴 복약 일정(약 이름·시각)과 알림 단추 기록도 비웁니다
    try{ if(N&&typeof N.scheduleMeds==="function") N.scheduleMeds(JSON.stringify({on:false,quiet:{from:"21:30",to:"08:00"},items:[]})); }catch(e){}
    try{ if(N&&typeof N.medsLogTake==="function") N.medsLogTake(); }catch(e){}
    try{ if(navigator.clearAppBadge){ var c=navigator.clearAppBadge(); if(c&&c.catch) c.catch(function(){}); } }catch(e){}
    try{ var ks=[]; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&/^(medinote|medit):/.test(k)&&!WIPE_KEEP[k]) ks.push(k); }
      ks.forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
  }
  function askWipe(kind){
    var w=el("mnlg-wipe"); if(!w) return;
    // 칸을 먼저 보이게 한 뒤 글을 넣어야 role="alert" 가 질문을 낭독한다 — 숨긴 채 넣으면 단추만 읽힌다 (#174 MN-174-3 가)
    w.style.display="block";
    el("mnlg-wipe-q").textContent=(kind==="logout"?"로그아웃합니다. ":"")+"이 기기에 남은 복약 일정·복용 기록·증상 기록 사본·측정값도 지울까요? 계정에 저장한 기록은 지워지지 않습니다.";
    el("mnlg-wipe-yes").textContent=(kind==="logout")?"지우고 로그아웃":"지우기";
    el("mnlg-wipe-no").textContent=(kind==="logout")?"남기고 로그아웃":"취소";
    // 지운 뒤에는 화면 안에 남은 상태(복약 일정 등)까지 비우려고 다시 엽니다
    el("mnlg-wipe-yes").onclick=function(){ w.style.display="none"; if(kind==="logout") logout(function(){ wipeDevice(); location.reload(); }); else { wipeDevice(); location.reload(); } };
    el("mnlg-wipe-no").onclick=function(){ w.style.display="none"; if(kind==="logout") logout(); };
    el("mnlg-wipe-yes").focus();
  }

  function initSb(){
    try{ if(window.supabase&&window.supabase.createClient){
      sb=window.supabase.createClient(SB_URL,SB_KEY);
      sb.auth.getSession().then(function(r){ var s=r&&r.data&&r.data.session; share(s); if(s&&s.user){ user=s.user; setUid(user.email||user.id,(user.app_metadata&&user.app_metadata.provider)||"email"); } paint(); }).catch(function(){ paint(); });
      sb.auth.onAuthStateChange(function(_e,ss){ share(ss); if(ss&&ss.user){ user=ss.user; setUid(user.email||user.id,(user.app_metadata&&user.app_metadata.provider)||"email"); } paint(); });
    } }catch(e){}
  }

  build(); initSb(); paint();
  window.MediNoteLogin={ open:open, close:close, setUid:setUid, uid:uid,
    google:googleLogin,
    user:function(){ return user; }, client:function(){ return sb; } };
})();
</script>

</body></html>
