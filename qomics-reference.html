<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediNote 연구 참고 — Q-omics 약물유전체 스냅샷</title>
<style>
  :root { --brand:#0F5C63; --bg:#EAF0F1; --border:#D8E5E7; --warn:#B45309; --warn-bg:#FFF7ED; --text:#0F2327; --sub:#577377; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; background:var(--bg); color:var(--text); padding: 24px 16px 60px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .banner { background: var(--warn-bg); border: 1.5px solid #FED7AA; border-radius: 14px; padding: 16px 18px; margin-bottom: 20px; font-size: 13.5px; line-height: 1.7; color: var(--warn); }
  .banner b { color: #9A3412; }
  h1 { font-size: 20px; margin: 0 0 4px; color: var(--brand); }
  .sub { font-size: 13px; color: var(--sub); margin: 0 0 20px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: #F2F6F7; color: var(--brand); }
  .meta { font-size: 11.5px; color: var(--sub); line-height: 1.7; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .tablewrap { max-height: 420px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
  thead th { position: sticky; top: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    ⚠ <b>연구 참고용 스냅샷입니다.</b> Q-omics(CBiS Inc.)를 통해 조회한 암 코호트(TCGA/CPTAC) 연구 데이터이며, 실제 개인 처방·복약 판단에 사용되지 않습니다. 실시간 호출이 아니라 저장된 스냅샷입니다.
  </div>
  <h1>MediNote 연구 참고 — Q-omics 약물유전체 데이터</h1>
  <p class="sub" id="subline">불러오는 중...</p>
  <div id="host"></div>
</div>
<script>
fetch('data/qomics-pharmacogenomics-snapshot.json').then(r => r.json()).then(data => {
  document.getElementById('subline').textContent = `출처: ${data.source} · 조회일: ${data.snapshotDate}`;
  const host = document.getElementById('host');
  for (const a of data.analyses) {
    const card = document.createElement('div'); card.className = 'card';
    let html = `<h3>${a.title}</h3><p style="font-size:12px;color:#577377">${a.criteria || ''} · 매칭 쌍: ${a.matchedPairs ?? '-'}</p>`;
    html += '<div class="tablewrap"><table><thead><tr>' + a.columns.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
    for (const row of a.rows) html += '<tr>' + row.map(v => `<td>${v}</td>`).join('') + '</tr>';
    html += '</tbody></table></div>';
    if (a.lineageSummary) {
      html += `<div class="meta"><b>${a.lineageSummary.note}</b><br>` + a.lineageSummary.rows.map(r => `${r[0]}: ${r[1]}건`).join(' · ') + '</div>';
    }
    card.innerHTML = html; host.appendChild(card);
  }
  const metaEl = document.createElement('div'); metaEl.className = 'meta';
  metaEl.textContent = data.refreshInstruction + ' — ' + data.disclaimer;
  host.appendChild(metaEl);
}).catch(e => { document.getElementById('subline').textContent = '불러오기 실패: ' + e.message; });
</script>
</body>
</html>
